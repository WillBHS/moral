<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도덕 AI 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hi+Melody&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --chatbg: #FDEFF6;
    --chatbg2: #F6E4F7;
    --topbar: #C9A2E8;
    --topbar-text: #FFFFFF;
    --ai-bubble: #FFFFFF;
    --ai-text: #4A3A55;
    --user-bubble: #FFD3E4;
    --user-text: #6B2C4C;
    --accent: #B98CE3;
    --accent-dark: #9A6BCB;
    --meta: #B29BC7;
    --danger: #FF8FA0;
    --shadow: 0 3px 8px rgba(180,140,220,0.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #F1E4F5;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ai-text);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    height: calc(100vh - 32px);
    max-height: 900px;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at 10% 15%, rgba(255,255,255,0.5) 2px, transparent 2px) 0 0/28px 28px,
      linear-gradient(180deg, var(--chatbg) 0%, var(--chatbg2) 100%);
    box-shadow: 0 4px 28px rgba(0,0,0,0.22);
    border-radius: 24px;
    position: relative;
    overflow: hidden;
  }
  #statusbar {
    flex: 0 0 auto;
    background: var(--topbar);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 20px 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #statusbar .sb-icons { display: flex; align-items: center; gap: 5px; }
  #statusbar svg { display: block; }
  header {
    flex: 0 0 auto;
    background: linear-gradient(135deg, var(--topbar), #E3B8F0);
    color: var(--topbar-text);
    padding: 14px 16px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 3px 10px rgba(150,100,190,0.25);
    border-radius: 0 0 22px 22px;
    z-index: 5;
  }
  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    flex: 0 0 auto;
    box-shadow: 0 2px 6px rgba(150,100,190,0.3);
  }
  .head-text { flex: 1; min-width: 0; }
  .head-text .name {
    font-family: 'Hi Melody', cursive;
    font-weight: 400;
    font-size: 19px;
    line-height: 1.3;
  }
  .head-text .status {
    font-size: 12.5px;
    color: rgba(255,255,255,0.85);
    display: flex; align-items: center; gap: 4px;
  }
  .head-text .status .led {
    width: 7px; height: 7px; border-radius: 50%;
    background: #B6FFCB;
    box-shadow: 0 0 4px #B6FFCB;
  }
  #reset-btn {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 5px;
    padding: 7px 12px 7px 9px;
    border-radius: 999px;
    border: none;
    background: rgba(255,255,255,0.22);
    color: #fff;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: transform .15s, background .15s;
    white-space: nowrap;
  }
  #reset-btn .reset-icon { font-size: 15px; display: inline-block; }
  #reset-btn:hover { background: rgba(255,255,255,0.35); }
  #reset-btn:active .reset-icon { transform: rotate(-90deg); }
  #reset-btn:active { transform: scale(0.95); }
  #transcript {
    flex: 1;
    padding: 22px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .row { display: flex; flex-direction: column; margin: 5px 0; max-width: 100%; }
  .row.grouped-row { margin-top: 2px; }
  .row.ai { align-items: flex-start; }
  .row.user { align-items: flex-end; }
  .bwrap { display: flex; flex-direction: column; max-width: 84%; }
  .row.ai .bwrap { align-items: flex-start; }
  .row.user .bwrap { align-items: flex-end; }
  .timestamp {
    font-size: 10.5px;
    color: #9C8FA8;
    margin: 3px 6px 0;
  }
  .bubble {
    max-width: 100%;
    padding: 9px 13px;
    line-height: 1.5;
    font-size: 16px;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: var(--shadow);
    position: relative;
  }
  .bubble.ai {
    background: var(--ai-bubble);
    color: var(--ai-text);
    border-radius: 20px 20px 20px 6px;
  }
  .bubble.ai.grouped { border-radius: 18px; margin-bottom: 2px; }
  .bubble.ai.tight { border-top-left-radius: 18px; }
  .bubble.user {
    background: var(--user-bubble);
    color: var(--user-text);
    border-radius: 20px 20px 6px 20px;
  }
  .bubble.user.grouped { border-radius: 18px; margin-bottom: 2px; }
  .bubble.user.tight { border-top-right-radius: 18px; }
  .bubble.thinking {
    background: var(--ai-bubble);
    color: var(--meta);
    border-radius: 20px 20px 20px 6px;
    font-size: 14px;
    padding: 12px 16px;
  }
  .dot-flash { display: inline-block; }
  .dot-flash span {
    display: inline-block; width: 6px; height: 6px; margin-right: 3px;
    border-radius: 50%; background: var(--accent);
    animation: blink 1.2s infinite ease-in-out;
  }
  .dot-flash span:nth-child(2) { animation-delay: .2s; }
  .dot-flash span:nth-child(3) { animation-delay: .4s; }
  .user-dots span { background: var(--user-text); }
  .typing-bubble { padding: 10px 14px; }
  @keyframes blink { 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }
  .case-box {
    max-width: 86%;
    margin: 4px 0 2px;
    border-radius: 20px;
    padding: 15px 17px 14px;
    background: var(--ai-bubble);
    box-shadow: var(--shadow);
    font-size: 16px;
    line-height: 1.65;
    border: 2px dashed #E6C9F2;
  }
  .case-box .tag {
    display: block;
    font-family: 'Hi Melody', cursive;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 6px;
  }
  .hint {
    font-size: 13px;
    color: var(--meta);
    padding: 2px 6px 4px;
  }
  .transcript-hint {
    margin-top: 2px;
    max-width: 84%;
  }
  .todo-card {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    max-width: 84%;
    margin: 2px 0;
    padding: 10px 14px;
    border-radius: 14px;
    border: 1.5px dashed #F2B84B;
    background: #FFF6E5;
    color: #8A5A00;
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.4;
  }
  .todo-icon { flex: 0 0 auto; font-size: 15px; margin-top: 1px; }
  #inputzone {
    flex: 0 0 auto;
    background: #FBF3FA;
    padding: 16px 14px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    border-top: 2px solid #F1DCF2;
    border-radius: 22px 22px 0 0;
  }
  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
    padding: 0 2px;
  }
  button.chip {
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    font-size: 14.5px;
    padding: 9px 15px;
    border-radius: 999px;
    border: none;
    background: #F3E4FB;
    color: var(--accent-dark);
    cursor: pointer;
    box-shadow: 0 2px 4px rgba(180,140,220,0.15);
    transition: transform .1s, background .15s;
  }
  button.chip:hover { background: #E9D2F7; }
  button.chip:active { transform: scale(0.94); }
  button.chip.secondary { background: #F0F0F0; color: #8A8A8A; }
  button.chip.warn { background: #FFE1E6; color: #E0567A; }
  button.chip:disabled { opacity: .35; cursor: default; }
  .textrow {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .textrow textarea {
    flex: 1;
    resize: none;
    min-height: 40px;
    max-height: 110px;
    padding: 10px 15px;
    border-radius: 20px;
    border: none;
    background: #fff;
    color: #232323;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px;
    line-height: 1.4;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
  }
  .textrow textarea:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--accent); }
  .textrow textarea::placeholder { color: #A6A6A6; }
  .textrow button.send {
    flex: 0 0 auto;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 6px rgba(180,140,220,0.4);
  }
  .textrow button.send:disabled { opacity: .4; }
  .textrow button.send:active { transform: scale(0.92); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }

  /* ---- 설정 화면 (API 키 입력 / 방 정보) ---- */
  #setup-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #C9A2E8, #F1E4F5);
    padding: 20px;
  }
  .setup-card {
    background: #fff;
    border-radius: 22px;
    padding: 28px 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  }
  .setup-emoji { font-size: 40px; margin-bottom: 6px; }
  .setup-card h2 { margin: 0 0 14px; font-family: 'Hi Melody', cursive; font-size: 22px; color: var(--accent-dark); }
  .setup-card p { font-size: 14px; line-height: 1.6; color: #4A3A55; margin: 0 0 14px; }
  .setup-card input {
    width: 100%; box-sizing: border-box;
    padding: 12px 14px; border-radius: 12px;
    border: 1.5px solid #E0C9F0; font-size: 14px;
    margin-bottom: 10px;
  }
  .setup-card button {
    width: 100%; padding: 13px; border-radius: 12px; border: none;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-bottom: 8px;
  }
  .setup-card button:active { transform: scale(0.98); }
  .setup-secondary-btn { background: #F0E4FA !important; color: var(--accent-dark) !important; }
  .setup-hint { font-size: 12px; color: #9C8FA8; }
  .setup-hint a { color: var(--accent-dark); }
  .setup-error { color: #E0567A; font-size: 13px; min-height: 18px; }
  .room-code {
    font-family: 'Hi Melody', cursive;
    font-size: 30px; letter-spacing: 4px;
    background: #F6ECFB; border-radius: 14px;
    padding: 10px; margin: 10px 0;
    color: var(--accent-dark);
  }
  .room-qr { width: 160px; height: 160px; margin: 8px auto; display: block; border-radius: 10px; }
  .room-link {
    font-size: 12px; color: #6B5A80; word-break: break-all;
    background: #F8F3FB; border-radius: 8px; padding: 8px; margin-bottom: 10px;
  }
  #share-btn {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.22);
    border: none; color: #fff; border-radius: 999px;
    font-size: 16px; width: 34px; height: 34px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="setup-overlay">
  <div class="setup-card">
    <div class="setup-emoji">🤖</div>
    <h2>도덕 AI 도우미</h2>

    <div id="setup-step-key">
      <p>선생님의 Gemini API 키를 입력해 주세요.<br>이 키는 서버에만 저장되고, 학생에게는 노출되지 않아요.</p>
      <input id="setup-api-key" type="password" placeholder="Gemini API 키 붙여넣기">
      <button id="setup-create-btn">방 만들기</button>
      <p class="setup-hint">키가 없으신가요? <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>에서 무료로 발급받을 수 있어요.</p>
      <div id="setup-error" class="setup-error"></div>
    </div>

    <div id="setup-step-room" style="display:none;">
      <p>✅ 방이 만들어졌어요! (48시간 동안 유효)</p>
      <div class="room-code" id="room-code-display"></div>
      <img id="room-qr" class="room-qr" alt="학생용 QR 코드">
      <div class="room-link" id="room-link-display"></div>
      <button id="room-copy-btn" class="setup-secondary-btn">🔗 링크 복사</button>
      <button id="room-continue-btn">확인, 테스트해볼게요 →</button>
      <p class="setup-hint" style="margin-top:10px;"><a href="#" id="room-restart-link">다른 API 키로 새로 시작하기</a></p>
    </div>
  </div>
</div>

<div id="app">
  <div id="statusbar">
    <span id="clock">9:41</span>
    <span class="sb-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="2" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="currentColor"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M8 2.2c2.1 0 4 .8 5.5 2.2l-1.4 1.4A6 6 0 0 0 8 4c-1.6 0-3.1.6-4.1 1.8L2.5 4.4C4 3 5.9 2.2 8 2.2z" fill="currentColor"/><path d="M8 6c1 0 1.9.4 2.6 1l-1.3 1.4a1.8 1.8 0 0 0-2.6 0L5.4 7A3.6 3.6 0 0 1 8 6z" fill="currentColor"/><circle cx="8" cy="9.3" r="1" fill="currentColor"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="15" height="7" rx="1.3" fill="currentColor"/><rect x="21.5" y="3.5" width="1.6" height="4" rx="0.8" fill="currentColor"/></svg>
    </span>
  </div>
  <header>
    <div class="avatar">🤖</div>
    <div class="head-text">
      <div class="name">도덕 AI 도우미</div>
      <div class="status"><span class="led"></span><span id="stage-text">최초 접속</span></div>
    </div>
    <button id="share-btn" title="학생 공유 링크 보기" onclick="showRoomInfo()" style="display:none;">🔗</button>
    <button id="reset-btn" title="대화 초기화" onclick="resetAll()"><span class="reset-icon">🔄</span>대화 초기화</button>
  </header>
  <div id="transcript"></div>
  <div id="inputzone"></div>
</div>

<script>
const STAGE_LABEL = {
  landing: '최초 접속', value: '덕목 정하기', act1_intro: '활동1 안내', act1_interest: '활동1 · 관심사',
  act1_case: '활동1 · 사례', act1_def1: '활동1 · 정의', act2_menu: '활동2 · 맥락 선택',
  act2_situation: '활동2 · 상황', act2_def2: '활동2 · 정의', act3_q1: '활동3 · 생각해보기',
  act3_situation: '활동3 · 가상 상황', end: '종료'
};

const INITIAL_STATE = {
  step: 'landing',
  value: '', interest: null,
  def1: '', def2: '',
  caseIdx: 0, cases: [], caseEasedThisSlot: false, caseAnswerRejectCount: 0, koreaCount: 0,
  context: '', situationEased: false, situationHistory: [],
  q1choice: null, q1answer1: '', q1answer2: '', q1reason: '', direction: null, counterHistory: [],
  situationTexts: [], situationDirections: [], currentSituationIdx: 0,
  busy: false,
};
const state = JSON.parse(JSON.stringify(INITIAL_STATE));

// ---------- prompts (editable via prompts.json when deployed) ----------
const DEFAULT_PROMPTS = {
  safetyRules: "[사례 생성 금지 규칙] 폭력·잔인한 묘사, 성적 내용, 공포·혐오, 특정 집단 비하, 불법행위 조장, 자살·학대 등 무거운 사회문제, 정치적 편향, 재난/전쟁 등 거창한 배경, 학생이 실행 불가능한 행동(글로벌 모금 등), 작위적으로 완벽한 선인/악인, 게임 관련 소재는 절대 포함하지 마라. 모든 사례는 초등 6학년이 뉴스를 몰라도 이해할 수 있는 쉬운 수준이어야 한다.\n[주객전도 방지] 관심사는 배경·소재로만 쓰고, 도덕적 행동의 최종 수혜자는 반드시 '사람'이어야 한다. 관심사(동물, 사물 등) 자체가 감정·도움의 최종 대상이 되면 안 된다.",

  caseGenerationTemplate: "너는 초등 6학년 도덕 수업용 사례를 만드는 작가다.\n탐구가치: [{{value}}]\n사례 유형: {{typeDefinition}}\n{{interestLine}}\n{{internationalLine}}\n{{avoidLine}}\n{{easierLine}}\n\n[관심사 비중 제한 — 필수] 관심사는 배경·장소·소품 정도로만 아주 짧게 언급하라. 이야기의 상황 전개와 인물의 행동은 관심사와 무관하게 현실적이어야 한다. 관심사를 자연스럽게 녹이기 어렵다면 과감히 포기하고 평범한 배경으로 써라 — 관심사를 반드시 넣어야 한다는 압박보다 이야기의 현실성이 항상 우선이다.\n\n[예시 — 실제 탐구가치와 무관한 참고용]\n🚫 나쁜 예(관심사에 매몰되어 비현실적): \"민준이는 강아지와 함께 우주 대회에 나가 우승한 뒤, 상금으로 반려동물 용품을 잔뜩 사서 동물보호소에 기부하는 상상을 하며 하루 종일 강아지 옷을 만들었다.\" (관심사 요소가 이야기 전체를 지배하고, 현실에서 벌어지기 어려운 설정이 겹쳐 있다)\n✅ 좋은 예(관심사는 배경으로만 짧게): \"민준이는 강아지와 산책하다가, 길에서 넘어져 짐이 쏟아진 할머니를 보았다. 민준이는 산책을 잠시 멈추고 짐 줍는 걸 도와드렸다.\" (강아지는 배경 한 조각일 뿐, 나머지는 현실적인 상황과 행동)\n\n[자체 점검 — 필수, 출력하지 말고 내부적으로만 수행] 초안을 쓴 뒤 스스로 확인하라: (1) 이 상황이 실제로 일어날 법한가? (2) 관심사 때문에 상황이나 인물의 행동이 부자연스러워지지 않았는가? 둘 중 하나라도 '아니오'라면 관심사 비중을 낮추거나 빼고 다시 써라. 점검 과정 자체는 출력하지 말고 통과한 최종 이야기만 출력하라.\n\n이야기를 정확히 2~3문장으로만 작성하라. 다른 설명, 제목, 따옴표 없이 이야기 본문만 출력하라.\n\n{{depthAndContrastRule}}\n{{safetyRules}}",

let PROMPTS = DEFAULT_PROMPTS;
async function loadPrompts() {
  try {
    const res = await fetch('./prompts.json', { cache: 'no-store' });
    if (res.ok) PROMPTS = await res.json();
  } catch (e) { /* prompts.json이 없으면(예: 이 미리보기 화면) 기본값을 그대로 쓴다 */ }
}

function fillTemplate(str, vars) {
  return str.replace(/\{\{(\w+)\}\}/g, (m, k) => (k in vars ? vars[k] : ''));
}

const CASE_TYPE_KEYS = ['model', 'contrary', 'related', 'borderline'];
const CASE_TYPES = CASE_TYPE_KEYS.map(key => ({
  key,
  ask: (v) => {
    const b = hasBatchim(v);
    return fillTemplate(PROMPTS.caseTypes[key].askTemplate, {
      value: v,
      waGwa: b ? '과' : '와',
      iRago: b ? '이라고' : '라고',
    });
  },
}));

// 한글 단어의 받침 유무를 판단해 조사를 자동으로 고른다(을/를, 이/가, 와/과 등).
function hasBatchim(word) {
  if (!word) return false;
  const ch = word.trim().slice(-1);
  const code = ch.charCodeAt(0);
  if (code < 0xAC00 || code > 0xD7A3) return false; // 한글 음절이 아니면 받침 없음으로 취급
  return (code - 0xAC00) % 28 !== 0;
}
// 활동1 사례 답변 검증: AI 판정 대신, 명백히 의미 없는 답변만 규칙 기반으로 걸러낸다.
// (짧아도 뜻이 통하는 답까지 AI가 자꾸 부적절로 오판하던 문제를 근본적으로 없애기 위함)
const JUNK_ANSWERS = ['몰라요', '모름', '모르겠어요', '모르겠음', 'ㅇㅇ', 'ㄴㄴ', 'ㅁㄹ', '글쎄', '글쎄요', '그냥', '없음', '없어요', '패스'];
function isObviouslyInadequate(answer) {
  const trimmed = (answer || '').trim();
  if (!trimmed) return true;
  // 숫자만 입력(뒤에 "번", "개", 마침표·느낌표 정도만 붙은 경우까지 포함 — 예: "2", "2번", "2.")
  if (/^\d{1,2}(번|개)?[.!]?$/.test(trimmed)) return true;
  if (trimmed.replace(/\s/g, '').length <= 1) return true; // 한 글자짜리
  if (JUNK_ANSWERS.includes(trimmed)) return true; // 상투적인 무의미 답변
  return false;
}
// 활동1 사례 박스 상단에 표시할, 사례 유형별 태그 문구.
function caseTag(typeKey, value) {
  const b = hasBatchim(value);
  switch (typeKey) {
    case 'model': return `${value}${b ? '을' : '를'} 잘 보여주는 이야기`;
    case 'contrary': return `${value}${b ? '이라고' : '라고'} 말할 수 없는 이야기`;
    case 'related': return `${value}${b ? '과' : '와'} 비슷해 보이지만 다른 이야기`;
    case 'borderline': return `${value}인 것 같기도 하고, 아닌 것 같기도 한 이야기`;
    default: return '이야기';
  }
}

// 이전 이야기를 요약할 때 글자 수로 뭉텅 자르면 문장 중간에서 끊겨 "장면을 여는 방식"이
// 제대로 전달되지 않는다. 첫 문장(마침표/느낌표/물음표까지)을 통째로 보여주는 게 더 정확하다.
function summarize(text) {
  const t = (text || '').trim();
  const m = t.match(/^[^.!?]*[.!?]/);
  if (m && m[0].length >= 6) return m[0].trim();
  return t.slice(0, 50).trim() + (t.length > 50 ? '...' : '');
}
function avoidLine(priorSummaries) {
  if (!priorSummaries.length) return '';
  const list = priorSummaries.map((s, i) => `${i+1}. ${s}`).join('\n');
  return fillTemplate(PROMPTS.avoidLineTemplate, { list });
}

function caseTypePrompt(type, value, interest, priorSummaries, forceInternational, easier) {
  const interestLine = interest
    ? fillTemplate(PROMPTS.interestLineWithInterest, { interest })
    : PROMPTS.interestLineWithout;
  return fillTemplate(PROMPTS.caseGenerationTemplate, {
    value,
    typeDefinition: fillTemplate(PROMPTS.caseTypes[type].definition, { value }),
    interestLine,
    internationalLine: forceInternational ? PROMPTS.internationalLine : '',
    avoidLine: avoidLine(priorSummaries),
    easierLine: easier ? PROMPTS.easierLine : '',
    depthAndContrastRule: fillTemplate(PROMPTS.depthAndContrastRule, { value }),
    safetyRules: PROMPTS.safetyRules,
  });
}

function situationPrompt(value, context, priorSummaries, easier) {
  return fillTemplate(PROMPTS.situationTemplate, {
    value, context,
    contextDesc: PROMPTS.situationContexts[context],
    internationalScopeLine: context === '국제사회' ? fillTemplate(PROMPTS.internationalScopeLine, { value }) : '',
    civicScopeLine: context === '국가' ? fillTemplate(PROMPTS.civicScopeLine, { value }) : '',
    easierLine: easier ? PROMPTS.easierLine : '',
    avoidLine: avoidLine(priorSummaries),
    depthAndContrastRule: fillTemplate(PROMPTS.depthAndContrastRule, { value }),
    safetyRules: PROMPTS.safetyRules,
  });
}

function q1FollowupPrompt(value, def2, choiceLabel) {
  return fillTemplate(PROMPTS.q1FollowupTemplate, { value, def2, choiceLabel });
}

function q1ProbePrompt(value, def2, answer) {
  return fillTemplate(PROMPTS.q1ProbeTemplate, { value, def2, answer });
}

function counterPrompt(value, def2, direction, reasonText, priorSummaries) {
  const directionDesc = fillTemplate(
    direction === 'A' ? PROMPTS.counterDirectionA : PROMPTS.counterDirectionB,
    { def2 }
  );
  return fillTemplate(PROMPTS.counterTemplate, {
    value, def2, reasonText, directionDesc,
    avoidLine: avoidLine(priorSummaries),
    depthAndContrastRule: fillTemplate(PROMPTS.depthAndContrastRule, { value }),
    safetyRules: PROMPTS.safetyRules,
  });
}

function interestExamplesPrompt(value) {
  return fillTemplate(PROMPTS.interestExamplesTemplate, { value, pool: PROMPTS.interestPool.join(', ') });
}

function virtueCheckPrompt(word) {
  return fillTemplate(PROMPTS.virtueCheckTemplate, { word });
}

// 방 코드(교사가 만들거나, 학생이 링크로 전달받은 값)를 통해 서버(/api/chat)를 거쳐
// AI를 호출한다. 실제 API 키는 서버에만 있고 이 브라우저에는 전혀 내려오지 않는다.
let ROOM_CODE = null;

async function ask(prompt, tier = 'default') {
  if (!ROOM_CODE) throw new Error('방 코드가 없습니다.');
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ roomCode: ROOM_CODE, prompt, tier }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    // 문제 진단용: 실제 실패 원인을 브라우저 콘솔(F12 → Console)에서 확인할 수 있게 남긴다.
    console.error('AI 호출 실패:', res.status, data.error, data.detail || '');
    throw new Error(data.error || 'API 요청에 실패했어요.');
  }
  return (data.text || '').trim();
}

// ---------- rendering ----------
const transcriptEl = document.getElementById('transcript');
const inputzoneEl = document.getElementById('inputzone');
const stageTextEl = document.getElementById('stage-text');
let log = [];

function scrollToBottom() {
  transcriptEl.scrollTop = transcriptEl.scrollHeight + 999;
}
// inputzone(버튼/질문/입력창)의 높이가 나중에 바뀌어도(예: 사례 제공 직후 질문·버튼이 추가되며 커질 때)
// 대화창이 항상 맨 아래에 고정되도록 크기 변화를 감지해서 재조정한다.
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => scrollToBottom()).observe(inputzoneEl);
}

function pushAI(text, opts = {}) {
  log.push({ who: 'ai', text, box: !!opts.box, hint: !!opts.hint, tag: opts.tag || null, ts: Date.now() });
  renderLog();
}
function pushTodo(text) {
  log.push({ who: 'ai', text, todo: true, ts: Date.now() });
  renderLog();
}
function pushUser(text) {
  log.push({ who: 'user', text, ts: Date.now() });
  renderLog();
}
function pushThinking(id) {
  log.push({ who: 'thinking', text: '', id });
  renderLog();
}
function popThinking(id) {
  log = log.filter(l => !(l.who === 'thinking' && l.id === id));
  renderLog();
}
// 학생이 입력창에 뭔가 타이핑 중일 때, 실제 메신저처럼 학생 쪽에 "입력 중..." 점 3개 말풍선을 보여준다.
let userTypingId = null;
function showUserTyping() {
  if (userTypingId) return;
  userTypingId = 'utyping' + Date.now();
  log.push({ who: 'user', typing: true, id: userTypingId });
  renderLog();
}
function hideUserTyping() {
  if (!userTypingId) return;
  log = log.filter(l => l.id !== userTypingId);
  userTypingId = null;
  renderLog();
}
// 텍스트 입력창에 입력 중 표시 로직을 붙여준다.
function wireTypingIndicator(ta) {
  ta.addEventListener('input', () => {
    if (ta.value.trim()) showUserTyping();
    else hideUserTyping();
  });
}
function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
// 버튼 그룹 중복 클릭 방지: 하나라도 누르면 그룹 전체를 즉시 비활성화한다.
function guardClick(buttons, fn) {
  return () => {
    if (buttons.some(b => b.disabled)) return;
    buttons.forEach(b => { b.disabled = true; });
    fn();
  };
}
// 여러 메시지를 연달아 보여줄 때, 실제 사람이 메시지를 하나씩 보내는 것처럼
// 짧은 "타이핑 중" 표시 후 하나씩 자연스럽게 등장시킨다.
async function sayAI(text, opts = {}) {
  const tid = 'say' + Date.now() + Math.random();
  pushThinking(tid);
  await sleep(450 + Math.random() * 250);
  popThinking(tid);
  pushAI(text, opts);
  await sleep(120);
}
async function sayTodo(text) {
  const tid = 'say' + Date.now() + Math.random();
  pushThinking(tid);
  await sleep(400 + Math.random() * 200);
  popThinking(tid);
  pushTodo(text);
  await sleep(120);
}
function fmtTime(ts) {
  const d = new Date(ts);
  const h = d.getHours(), m = d.getMinutes();
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function renderLog() {
  transcriptEl.innerHTML = '';
  log.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'row ' + (item.who === 'user' ? 'user' : 'ai');
    if (item.who === 'thinking') {
      const d = document.createElement('div');
      d.className = 'bubble thinking';
      d.innerHTML = '<span class="dot-flash"><span></span><span></span><span></span></span>';
      row.appendChild(d);
      transcriptEl.appendChild(row);
      return;
    }
    if (item.typing) {
      const d = document.createElement('div');
      d.className = 'bubble user typing-bubble';
      d.innerHTML = '<span class="dot-flash user-dots"><span></span><span></span><span></span></span>';
      row.appendChild(d);
      transcriptEl.appendChild(row);
      return;
    }
    if (item.box) {
      const box = document.createElement('div');
      box.className = 'case-box';
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = item.tag ? ('📖 ' + item.tag) : '📖 이야기';
      box.appendChild(tag);
      box.appendChild(document.createTextNode(item.text));
      row.appendChild(box);
      transcriptEl.appendChild(row);
      return;
    }
    if (item.hint) {
      const h = document.createElement('div');
      h.className = 'hint transcript-hint';
      h.textContent = item.text;
      row.appendChild(h);
      transcriptEl.appendChild(row);
      return;
    }
    if (item.todo) {
      const t = document.createElement('div');
      t.className = 'todo-card';
      const icon = document.createElement('span');
      icon.className = 'todo-icon';
      icon.textContent = '☑️';
      const txt = document.createElement('span');
      txt.textContent = item.text;
      t.appendChild(icon);
      t.appendChild(txt);
      row.appendChild(t);
      transcriptEl.appendChild(row);
      return;
    }
    const prev = log[i - 1];
    const next = log[i + 1];
    const groupedWithPrev = prev && prev.who === item.who && !prev.box && prev.who !== 'thinking';
    const groupedWithNext = next && next.who === item.who && !next.box && next.who !== 'thinking';
    if (groupedWithPrev) row.classList.add('grouped-row');
    const wrap = document.createElement('div');
    wrap.className = 'bwrap';
    const d = document.createElement('div');
    d.className = 'bubble ' + (item.who === 'ai' ? 'ai' : 'user') + (groupedWithNext ? ' grouped' : '') + (groupedWithPrev ? ' tight' : '');
    d.textContent = item.text;
    wrap.appendChild(d);
    if (!groupedWithNext) {
      const t = document.createElement('span');
      t.className = 'timestamp';
      t.textContent = fmtTime(item.ts || Date.now());
      wrap.appendChild(t);
    }
    row.appendChild(wrap);
    transcriptEl.appendChild(row);
  });
  scrollToBottom();
  if (stageTextEl) stageTextEl.textContent = STAGE_LABEL[state.step] || '';
}

function setInputChips(chips) {
  inputzoneEl.innerHTML = '';
  hideUserTyping();
  renderUndoRow();
  const row = document.createElement('div');
  row.className = 'choices';
  const allButtons = [];
  chips.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (c.variant ? ' ' + c.variant : '');
    b.textContent = c.label;
    b.disabled = state.busy || !!c.disabled;
    b.onclick = () => {
      if (b.disabled) return;
      allButtons.forEach(btn => { btn.disabled = true; }); // 중복 클릭 방지: 누르는 즉시 전부 비활성화
      c.onClick();
    };
    allButtons.push(b);
    row.appendChild(b);
  });
  inputzoneEl.appendChild(row);
  saveCheckpoint(() => setInputChips(chips));
}

function setInputText(placeholder, onSubmit, opts = {}) {
  inputzoneEl.innerHTML = '';
  hideUserTyping();
  renderUndoRow();
  if (opts.chipsAbove) {
    const row = document.createElement('div');
    row.className = 'choices';
    opts.chipsAbove.forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip' + (c.variant ? ' ' + c.variant : '');
      b.textContent = c.label;
      b.disabled = state.busy || !!c.disabled;
      b.onclick = () => c.onClick();
      row.appendChild(b);
    });
    inputzoneEl.appendChild(row);
  }
  const trow = document.createElement('div');
  trow.className = 'textrow';
  const ta = document.createElement('textarea');
  ta.placeholder = placeholder;
  ta.disabled = state.busy;
  const btn = document.createElement('button');
  btn.className = 'send';
  btn.innerHTML = '&#10148;';
  btn.disabled = state.busy;
  const submit = () => {
    const v = ta.value.trim();
    if (!v || state.busy || btn.disabled) return;
    hideUserTyping();
    btn.disabled = true;
    ta.disabled = true;
    onSubmit(v);
  };
  btn.onclick = submit;
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  wireTypingIndicator(ta);
  trow.appendChild(ta);
  trow.appendChild(btn);
  inputzoneEl.appendChild(trow);
  ta.focus();
  if (opts.checkpoint !== false) {
    saveCheckpoint(() => setInputText(placeholder, onSubmit, opts));
  }
}

function setBusy(v) { state.busy = v; }

// ---------- undo (되돌리기) ----------
let checkpoint = null;
function saveCheckpoint(redo) {
  checkpoint = { state: JSON.parse(JSON.stringify(state)), logLen: log.length, redo };
}
function renderUndoRow(extraChips = []) {
  // ⚠ 이 화면을 그리는 함수가 끝나면서 saveCheckpoint()를 다시 호출해 checkpoint를
  // "지금 이 화면"으로 덮어쓰기 때문에, 버튼 클릭 시점에 전역 checkpoint를 읽으면
  // 항상 "자기 자신"을 다시 그리는 것으로 귀결되는 버그가 있었다.
  // → 버튼을 만드는 지금 이 순간의 checkpoint를 스냅샷으로 따로 붙잡아,
  //    나중에 전역값이 바뀌어도 이 버튼은 그 스냅샷(=진짜 직전 화면)만 쓰도록 고정한다.
  const snapshot = checkpoint;
  if (!snapshot && extraChips.length === 0) return;
  const row = document.createElement('div');
  row.className = 'choices';
  const allButtons = [];
  if (snapshot) {
    const b = document.createElement('button');
    b.className = 'chip secondary';
    b.textContent = '↩️ 이전 답 다시 쓰기';
    b.onclick = () => { if (b.disabled) return; allButtons.forEach(btn => { btn.disabled = true; }); undoTo(snapshot); };
    allButtons.push(b);
    row.appendChild(b);
  }
  extraChips.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (c.variant ? ' ' + c.variant : '');
    b.textContent = c.label;
    b.onclick = () => { if (b.disabled) return; allButtons.forEach(btn => { btn.disabled = true; }); c.onClick(); };
    allButtons.push(b);
    row.appendChild(b);
  });
  inputzoneEl.appendChild(row);
}
function undoTo(snapshot) {
  if (!snapshot) return;
  if (checkpoint === snapshot) checkpoint = null; // 스냅샷이 여전히 최신 checkpoint라면 정리
  Object.keys(state).forEach(k => { delete state[k]; });
  Object.assign(state, JSON.parse(JSON.stringify(snapshot.state)));
  log.length = snapshot.logLen;
  renderLog();
  snapshot.redo();
}

// ---------- flow ----------
async function startApp() {
  await sayAI(`👋 안녕하세요! 저는 여러분의 도덕 수업을 도와주는 AI 도우미예요. 오늘 함께 탐구할 덕목과 관련된 다양한 사례와 상황을 제공해 줄게요.`);
  await sayAI(`🧠 하지만 중요한 판단은 언제나 여러분이 직접 해야 해요. 지금부터 저와 함께 의미 있는 도덕 수업을 만들어 보아요!`);
  setInputChips([{ label: '✏️ 시작할게요', onClick: onStartClicked }]);
}

function onStartClicked() {
  pushUser('시작할게요');
  state.step = 'value';
  pushAI(`🌱 오늘 탐구할 덕목을 알려주세요!
예) 인류애, 공정, 배려, 정직, 존중…

👉 덕목 단어 하나만 입력하면 돼요!`);
  setInputText('예: 인류애', onValueSubmit);
}

async function onValueSubmit(v) {
  pushUser(v);
  const trimmed = v.trim();

  setBusy(true);
  const tid = 't' + Date.now();
  pushThinking(tid);
  let valid = true;
  try {
    const verdict = await ask(virtueCheckPrompt(trimmed), 'quick');
    valid = !verdict.includes('부적절');
  } catch (e) {
    console.error('덕목 검증 중 오류:', e);
    // 검증 자체가 실패해도 수업 흐름이 막히지 않도록 통과시킨다.
  }
  popThinking(tid);
  setBusy(false);

  if (!valid) {
    pushAI('🤔 그건 이 수업에서 다룰 도덕적 가치로 보기 어려워요. 다른 덕목을 입력해 줄래요? (예: 인류애, 정직, 배려, 책임감)');
    setInputText('예: 인류애', onValueSubmit);
    return;
  }

  state.value = trimmed;
  state.step = 'act1_intro';
  await sayAI(`🌟 오늘 우리가 함께 탐구할 덕목은 바로 [${state.value}]군요!

🔍 [${state.value}]가 무엇인지, 어떤 상황에서 어떤 의미를 가지는지 지금부터 함께 깊이 탐구해볼 거예요.`);
  await sayAI(`✋ 잠깐! 지금은 AI의 도움보다 내 생각이 가장 먼저예요!

📒 내가 알고 있는 [${state.value}]와/과 관련있는 사례를 떠올려보세요.`);
  await sayTodo('활동지 ①에 먼저 써보세요. 🖊️');
  setInputChips([{ label: '🤖 다 썼어요, 사례 보여주세요', onClick: onCaseRequest }]);
}

function onCaseRequest() {
  pushUser('다 썼어요, 사례 보여주세요');
  state.step = 'act1_interest';
  askInterestExamples();
}

async function askInterestExamples() {
  setBusy(true);
  const tid = 't' + Date.now();
  pushThinking(tid);
  let examples = ['동물', '운동', '음악', '미술', '요리', '여행'];
  try {
    const text = await ask(interestExamplesPrompt(state.value), 'default');
    const parts = text.split(',').map(s => s.trim()).filter(Boolean);
    const clean = parts.filter(p => PROMPTS.interestPool.includes(p));
    if (clean.length >= 4) examples = clean.slice(0, 6);
  } catch (e) { /* fall back to defaults */ }
  popThinking(tid);
  setBusy(false);
  pushAI(`🎯 여러분에게 좀 더 와닿는 사례를 제공하기 위해 한 가지만 물어볼게요!

❓평소에 어떤 분야에 관심이 있나요? 아래 중에서 골라주세요!`);
  const chips = examples.map(ex => ({ label: ex, onClick: () => onInterestPick(ex) }));
  chips.push({ label: '없어요', variant: 'secondary', onClick: () => onInterestPick('없어요') });
  setInputChips(chips);
}

function onInterestPick(v) {
  pushUser(v);
  const isNone = PROMPTS.noneWords.some(w => v.includes(w));
  if (isNone) {
    state.interest = null;
    pushAI('알겠어요! 그럼 다양한 일상 사례로 시작해볼게요 😊');
  } else {
    state.interest = v;
  }
  beginCases();
}

function beginCases() {
  state.caseIdx = 0;
  state.cases = [];
  state.caseEasedThisSlot = false;
  state.caseAnswerRejectCount = 0;
  state.koreaCount = 0;
  generateAndShowCase();
}

async function generateAndShowCase(easier = false) {
  state.step = 'act1_case';
  setBusy(true);
  const tid = 't' + Date.now();
  pushThinking(tid);
  const idx = state.caseIdx;
  const type = CASE_TYPES[idx];
  let forceIntl = false;
  if (state.value.includes('인류애')) {
    const remainingSlots = 4 - idx;
    const needed = 2 - state.koreaCount;
    if (needed >= remainingSlots && needed > 0) forceIntl = true;
  }
  const priorSummaries = state.cases.map(c => summarize(c.text));
  let text;
  try {
    const p = caseTypePrompt(type.key, state.value, state.interest, priorSummaries, forceIntl, easier);
    text = await ask(p);
  } catch (e) {
    text = '(이야기를 만드는 데 문제가 생겼어요. 다시 시도해 주세요.)';
  }
  popThinking(tid);
  setBusy(false);

  if (forceIntl || /다른 나라|외국|국경|난민|이주|해외/.test(text)) state.koreaCount++;
  state.cases.push({ text });

  const ordinal = ['첫','두','세','네'][idx] + ' 번째';
  await sayAI(`📖 ${ordinal} 사례예요 (${idx+1}/4):`);
  await sayAI(text, { box: true, tag: caseTag(type.key, state.value) });
  renderCaseInputArea();
}

function onHarderCaseComplain() {
  if (!state.caseEasedThisSlot) {
    pushUser('사례가 어려워요');
    state.caseEasedThisSlot = true;
    pushAI('알겠어요, 조금 더 쉬운 사례로 바꿔드릴게요 🔄');
    generateAndShowCase(true);
  } else {
    pushUser('다른 사례로 바꿔주세요');
    pushAI('새로운 사례로 보여드릴게요 🔄');
    generateAndShowCase(false);
  }
}

function renderCaseInputArea() {
  const type = CASE_TYPES[state.caseIdx];
  const q = type.ask(state.value);
  inputzoneEl.innerHTML = '';
  hideUserTyping();
  const chipLabel = state.caseEasedThisSlot ? '🔄 다른 사례로 바꿔볼래요' : '😵 사례가 어려워요';
  const extraChips = [{ label: chipLabel, variant: 'secondary', onClick: onHarderCaseComplain }];
  renderUndoRow(extraChips);
  const qEl = document.createElement('div');
  qEl.className = 'bubble ai';
  qEl.style.margin = '6px 0';
  qEl.textContent = '🤔 ' + q;
  inputzoneEl.appendChild(qEl);
  const trow = document.createElement('div');
  trow.className = 'textrow';
  const ta = document.createElement('textarea');
  ta.placeholder = '내 생각을 적어보세요';
  const btn = document.createElement('button');
  btn.className = 'send';
  btn.innerHTML = '&#10148;';
  const submit = () => { const v = ta.value.trim(); if (v && !btn.disabled) { hideUserTyping(); btn.disabled = true; ta.disabled = true; onCaseAnswer(v); } };
  btn.onclick = submit;
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
  wireTypingIndicator(ta);
  trow.appendChild(ta); trow.appendChild(btn);
  inputzoneEl.appendChild(trow);
  ta.focus();
  saveCheckpoint(renderCaseInputArea);
}

// 활동1 사례 탐구질문에 대한 반응 — Green 단계 원칙상 AI가 학생 생각에 개입하면 안 되므로,
// 내용과 무관한 짧은 확인 멘트를 미리 정해둔 목록에서 무작위로 고른다(AI 생성 불필요).
const MIRROR_REPLIES = ['네, 잘 들었어요.', '알겠어요.', '적어주셔서 고마워요.', '확인했어요.', '그렇군요.'];
let lastMirrorIdx = -1;
function pickMirrorReply() {
  let idx;
  do { idx = Math.floor(Math.random() * MIRROR_REPLIES.length); } while (idx === lastMirrorIdx && MIRROR_REPLIES.length > 1);
  lastMirrorIdx = idx;
  return MIRROR_REPLIES[idx];
}

async function onCaseAnswer(v) {
  pushUser(v);
  setBusy(true);
  inputzoneEl.innerHTML = '';

  // 이 검증은 AI 판단이 아니라 명백한 무의미 입력(숫자만, 한 글자, 상투어)만 규칙으로 걸러내는 것이라
  // 오탐(정상 답을 잘못 막는) 위험이 없다. 그래서 "1회 제한" 같은 예외 없이 몇 번이든 항상 적용한다.
  const adequate = !isObviouslyInadequate(v);

  if (!adequate) {
    setBusy(false);
    state.caseAnswerRejectCount++;
    pushAI('🤔 조금 더 자세히 생각을 들려줄 수 있을까요? 왜 그렇게 느꼈는지 궁금해요!');
    renderCaseInputArea();
    return;
  }

  setBusy(false);
  pushAI(pickMirrorReply());
  await sleep(300);

  const isLast = state.caseIdx === 3;
  if (!isLast) {
    await sayTodo('함께 탐구한 내용을 활동지에도 기록했나요?');
    const nextOrdinal = ['두','세','네'][state.caseIdx];
    setInputChips([{ label: `👀 ${nextOrdinal} 번째 사례 만나러 가기`, onClick: () => {
      pushUser(`${nextOrdinal} 번째 사례 만나러 갈게요`);
      state.caseIdx++;
      state.caseEasedThisSlot = false;
      state.caseAnswerRejectCount = 0;
      generateAndShowCase();
    }}]);
  } else {
    pushAI(`✨ 네 가지 사례를 모두 살펴봤어요!

네 가지 사례를 탐구해보니, [${state.value}]의 뜻이 무엇인지 알 것 같나요?
[${state.value}] 뜻을 적어 보세요! ✏️`);
    state.step = 'act1_def1';
    setInputText('내가 생각하는 뜻을 적어보세요', onDef1Submit);
  }
}

async function onDef1Submit(v) {
  pushUser(v);
  state.def1 = v;
  await sayAI(`✏️ 내가 정리한 [${state.value}]의 뜻은 "${v}"에요.`);
  await sayTodo('활동지 ③에도 정리해 주세요.');
  state.step = 'act2_menu';
  setInputChips([{ label: '🌏 활동2 시작하기', onClick: onAct2Start }]);
}

function onAct2Start() {
  pushUser('활동2 시작할게요');
  pushAI(`🌏 다양한 관계 속에서 [${state.value}]의 의미를 확장해 볼까요? 아래 중 하나를 골라보세요!`);
  setInputChips([
    { label: '👫 친구', onClick: () => onContextPick('친구') },
    { label: '👨‍👩‍👧 가족', onClick: () => onContextPick('가족') },
    { label: '🏘️ 국가', onClick: () => onContextPick('국가') },
    { label: '🌍 국제사회', onClick: () => onContextPick('국제사회') },
  ]);
}

async function onContextPick(ctx, easier = false) {
  pushUser(ctx);
  state.context = ctx;
  state.step = 'act2_situation';
  setBusy(true);
  const tid = 't' + Date.now();
  pushThinking(tid);
  let text;
  // 활동1 사례 + 지금까지 나온 활동2 상황을 전부 합쳐서, 실제로 겹치지 않도록 구체적으로 전달한다.
  const priorSummaries = [
    ...state.cases.map(c => summarize(c.text)),
    ...state.situationHistory.map(s => summarize(s)),
  ];
  try { text = await ask(situationPrompt(state.value, ctx, priorSummaries, easier)); }
  catch (e) { text = '(이야기를 만드는 데 문제가 생겼어요.)'; }
  popThinking(tid);
  setBusy(false);
  state.situationHistory.push(text);
  await sayAI(`📖 [${ctx}] 관계 속 이야기예요:`);
  await sayAI(text, { box: true });
  renderAct2SituationInput(ctx);
}

function renderAct2SituationInput(ctx) {
  inputzoneEl.innerHTML = '';
  hideUserTyping();
  renderUndoRow();
  const row1 = document.createElement('div');
  row1.className = 'choices';
  const allButtons = [];
  if (!state.situationEased) {
    const b = document.createElement('button');
    b.className = 'chip secondary';
    b.textContent = `😵 ${ctx} 관계 속 다른 이야기`;
    b.onclick = guardClick(allButtons, () => { pushUser(`${ctx} 관계 속 다른 이야기로 보여주세요`); state.situationEased = true; onContextPick(ctx, true); });
    allButtons.push(b);
    row1.appendChild(b);
  }
  ['친구','가족','국가','국제사회'].filter(c => c !== ctx).forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip secondary';
    b.textContent = c;
    b.onclick = guardClick(allButtons, () => { state.situationEased = false; onContextPick(c); });
    allButtons.push(b);
    row1.appendChild(b);
  });
  inputzoneEl.appendChild(row1);
  const row2 = document.createElement('div');
  row2.className = 'choices';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'chip';
  nextBtn.textContent = '✏️ 다음 질문으로 넘어갈게요';
  nextBtn.onclick = guardClick(allButtons, onAct2Next);
  allButtons.push(nextBtn);
  row2.appendChild(nextBtn);
  inputzoneEl.appendChild(row2);
  saveCheckpoint(() => renderAct2SituationInput(ctx));
}

async function onAct2Next() {
  pushUser('다음 질문으로 넘어갈게요');
  await sayTodo('위의 이야기를 통해 새롭게 발견한 [' + state.value + ']의 의미를 활동지 ④에 정리해보세요.');
  await sayAI(`🖊 처음 정리한 뜻은 "${state.def1}" 였어요. 관계 속 탐구를 바탕으로 [${state.value}]의 뜻을 다시 정리해서 적어 주세요.`);
  state.step = 'act2_def2';
  setInputText('다시 정리한 뜻을 적어보세요', onDef2Submit);
}

async function onDef2Submit(v) {
  pushUser(v);
  state.def2 = v;
  await sayAI(`📝 새로운 뜻은 "${v}"에요.`);
  await sayTodo('활동지 ⑤에 정리하고 짝과 비교해 보세요.');
  await sayTodo('기존의 뜻에서 달라진 점이 있다면 활동지 ⑥에 써보세요.');
  state.step = 'act3_q1';
  setInputChips([{ label: '🟡 활동3 시작하기', onClick: onAct3Start }]);
}

function onAct3Start() {
  pushUser('활동3 시작할게요');
  pushAI(`🤔 이제 내가 정리한 [${state.value}]의 뜻이 새로운 상황에 어울리는지 확인해 볼까요? 그 전에 하나만 물어볼게요 — 내가 정리한 [${state.value}]의 뜻이 모든 상황에서 딱 맞을 것 같나요?`);
  setInputChips([
    { label: '🙋 모든 상황에서 맞는다', onClick: () => onQ1Pick(1) },
    { label: '🤨 맞지 않는 상황이 있을 수도 있다', onClick: () => onQ1Pick(2) },
    { label: '❓ 모르겠다', onClick: () => onQ1Pick(3) },
  ]);
}

const Q1_FALLBACK = {
  1: '어떤 점 때문에 이 뜻이 어떤 상황에서도 다 맞을 거라고 생각했어요?',
  2: '어떤 점 때문에 맞지 않는 경우도 있을 것 같다고 생각했어요? 어떤 상황이 떠올랐는지 말해줄 수 있나요?',
  3: '어떤 부분이 헷갈렸는지 말해줄 수 있나요?',
};

async function onQ1Pick(n) {
  const labels = { 1: '모든 상황에서 맞는다', 2: '맞지 않는 상황이 있을 수도 있다', 3: '모르겠다' };
  pushUser(labels[n]);
  state.q1choice = n;
  if (n === 1) state.direction = 'A';
  else if (n === 2) state.direction = 'B';
  setBusy(true);
  const tid = 't' + Date.now();
  pushThinking(tid);
  let q = Q1_FALLBACK[n];
  try { q = await ask(q1FollowupPrompt(state.value, state.def2, labels[n]), 'quick'); } catch (e) {}
  popThinking(tid);
  setBusy(false);
  pushAI('🤔 ' + q);
  setInputText('내 생각을 적어보세요', onQ1FollowupSubmit);
}

// ④ 학생의 첫 답변에 이어, ⑤ 그 답변의 빈틈을 한 번 더 캐묻는 소크라테스식 두 번째 질문.
async function onQ1FollowupSubmit(v) {
  pushUser(v);
  state.q1answer1 = v;
  setBusy(true);
  const tid = 't' + Date.now();
  pushThinking(tid);
  let q2 = '그 생각을 조금 더 자세히 들려줄 수 있을까요?';
  try { q2 = await ask(q1ProbePrompt(state.value, state.def2, v), 'quick'); } catch (e) {}
  popThinking(tid);
  setBusy(false);
  pushAI('🤔 ' + q2);
  setInputText('내 생각을 적어보세요', onQ1ProbeSubmit);
}

// ⑥ 학생의 두 번째 답변까지 받은 뒤 ⑦ 가상 상황으로 넘어간다.
async function onQ1ProbeSubmit(v) {
  pushUser(v);
  state.q1answer2 = v;
  state.q1reason = (state.q1answer1 + ' ' + state.q1answer2).trim();
  if (state.direction === null) {
    state.direction = /맞|어렵|헷갈리는게 없|그래도/.test(state.q1reason) ? 'A' : 'B';
  }
  await sayTodo('지금까지 저와 함께 나눈 대화를 활동지 ⑦에 정리해 주세요.');
  await sayAI('👀 이제 가상 상황을 만나러 가볼까요?');
  state.step = 'act3_situation';
  setInputChips([{ label: '🟡 가상 상황 보기', onClick: onAct3Situation }]);
}

async function onAct3Situation(userMsg) {
  pushUser(userMsg || '가상 상황 보여주세요');
  setBusy(true);
  const tid = 't' + Date.now();
  pushThinking(tid);
  // 활동1 사례 + 활동2 상황 + 지금까지 나온 활동3 가상 상황을 전부 합쳐서 겹치지 않게 한다.
  const priorSummaries = [
    ...state.cases.map(c => summarize(c.text)),
    ...state.situationHistory.map(s => summarize(s)),
    ...state.counterHistory.map(s => summarize(s)),
  ];
  let textA, textB;
  // 상황1·상황2를 순서대로 만들면 그만큼 오래 걸리므로, 동시에 병렬로 요청한다.
  // (B가 A를 회피 목록에 참고하지 못하게 되는 대신, 방향 자체가 서로 달라서 겹칠 위험은 낮다.)
  [textA, textB] = await Promise.all([
    ask(counterPrompt(state.value, state.def2, 'A', state.q1reason, priorSummaries))
      .catch(() => '(이야기를 만드는 데 문제가 생겼어요.)'),
    ask(counterPrompt(state.value, state.def2, 'B', state.q1reason, priorSummaries))
      .catch(() => '(이야기를 만드는 데 문제가 생겼어요.)'),
  ]);
  popThinking(tid);
  setBusy(false);
  state.counterHistory.push(textA, textB);
  // 방향(A/B)을 학생마다 항상 같은 순서로 보여주면 "1번은 늘 이런 상황"이라는 고정관념이
  // 생길 수 있으므로, 제시 순서를 무작위로 섞는다.
  const flip = Math.random() < 0.5;
  state.situationTexts = flip ? [textB, textA] : [textA, textB];
  state.situationDirections = flip ? ['B', 'A'] : ['A', 'B'];
  state.currentSituationIdx = 0;
  await showCurrentSituation();
}

async function showCurrentSituation() {
  const idx = state.currentSituationIdx;
  await sayAI(`🟡 가상 상황${idx + 1}이에요. 내가 정리한 [${state.value}]의 뜻이 잘 적용되는지 확인해 보세요.`);
  await sayAI(state.situationTexts[idx], { box: true, tag: `가상 상황${idx + 1}` });
  renderSituationJudgmentChoice();
}

// 가상 상황(현재 보고 있는 것 하나만) 다른 버전으로 재생성.
async function onRegenCurrentSituation() {
  pushUser('다른 가상 상황으로 보여주세요');
  setBusy(true);
  const tid = 't' + Date.now();
  pushThinking(tid);
  const idx = state.currentSituationIdx;
  const otherText = state.situationTexts[1 - idx];
  const priorSummaries = [
    ...state.cases.map(c => summarize(c.text)),
    ...state.situationHistory.map(s => summarize(s)),
    ...state.counterHistory.map(s => summarize(s)),
    ...(otherText ? [summarize(otherText)] : []),
  ];
  let text;
  try { text = await ask(counterPrompt(state.value, state.def2, state.situationDirections[idx], state.q1reason, priorSummaries)); }
  catch (e) { text = '(이야기를 만드는 데 문제가 생겼어요.)'; }
  popThinking(tid);
  setBusy(false);
  state.situationTexts[idx] = text;
  state.counterHistory.push(text);
  await sayAI(`🟡 다른 가상 상황${idx + 1}이에요:`);
  await sayAI(text, { box: true, tag: `가상 상황${idx + 1}` });
  renderSituationJudgmentChoice();
}

// 상황을 보여준 뒤: "적용 결과를 골라보세요" + 3지선다 + 다른 가상 상황 버튼.
function renderSituationJudgmentChoice() {
  inputzoneEl.innerHTML = '';
  hideUserTyping();
  renderUndoRow([{ label: '🔄 다른 가상 상황으로', variant: 'secondary', onClick: onRegenCurrentSituation }]);
  const q = document.createElement('div');
  q.className = 'bubble ai';
  q.style.margin = '6px 0';
  q.textContent = `🤔 내가 정리한 [${state.value}]의 뜻을 적용한 결과를 아래에서 골라보세요.`;
  inputzoneEl.appendChild(q);
  const row = document.createElement('div');
  row.className = 'choices';
  const allButtons = [];
  ['내 뜻이 그래도 맞아요', '내 뜻을 일부 고쳐야 할 것 같아요', '내 뜻과 맞지 않는 상황이에요'].forEach(label => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = label;
    b.onclick = guardClick(allButtons, () => onJudgmentChoice(label));
    allButtons.push(b);
    row.appendChild(b);
  });
  inputzoneEl.appendChild(row);
  saveCheckpoint(renderSituationJudgmentChoice);
}

function onJudgmentChoice(label) {
  pushUser(label);
  pushAI('✏️ 위와 같은 판단을 한 이유를 적어보세요.');
  setInputText('이유를 적어보세요', onJudgmentReasonSubmit);
}

// 판단 이유 제출 — AI는 이 판단에 대해 옳고 그름을 평가하거나 반응하지 않고 곧바로 다음 단계로 진행한다.
async function onJudgmentReasonSubmit(v) {
  pushUser(v);
  if (state.currentSituationIdx === 0) {
    state.currentSituationIdx = 1;
    await showCurrentSituation();
  } else {
    await finishAct3();
  }
}

async function finishAct3() {
  await sayTodo('지금까지 저와 나눈 대화를 활동지 ⑧에 정리해 주세요.');
  await sayAI('🎉 지금부터는 스스로 해보는 시간이에요. 끝까지 최선을 다해 볼까요?🎉');
  await sayAI('💾 대화 내용을 다시 보고 싶다면, 화면을 위로 올려보세요!');
  state.step = 'end';
  inputzoneEl.innerHTML = '<div class="hint" style="text-align:center;padding:14px;">🙈 오늘의 탐구가 끝났어요. 스스로 정리하는 시간을 가져보세요!</div>';
}

function resetAll() {
  Object.keys(state).forEach(k => { delete state[k]; });
  Object.assign(state, JSON.parse(JSON.stringify(INITIAL_STATE)));
  log = [];
  checkpoint = null;
  renderLog();
  startApp();
}

function updateClock() {
  const el = document.getElementById('clock');
  if (!el) return;
  const d = new Date();
  const h = d.getHours(), m = d.getMinutes();
  el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
updateClock();
setInterval(updateClock, 15000);

// ---------- 방(room) 관리: API 키 등록 / 공유 링크·QR / 학생 접속 ----------
function buildShareUrl(code) {
  const url = new URL(window.location.href);
  url.search = '';
  url.hash = '';
  url.searchParams.set('room', code);
  return url.toString();
}

function showRoomInfo() {
  document.getElementById('setup-step-key').style.display = 'none';
  document.getElementById('setup-step-room').style.display = 'block';
  document.getElementById('room-code-display').textContent = ROOM_CODE;
  const link = buildShareUrl(ROOM_CODE);
  document.getElementById('room-link-display').textContent = link;
  document.getElementById('room-qr').src =
    'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(link);
  document.getElementById('setup-overlay').style.display = 'flex';
}

function hideSetupOverlay() {
  document.getElementById('setup-overlay').style.display = 'none';
}

function showShareButton() {
  const shareBtn = document.getElementById('share-btn');
  if (shareBtn) shareBtn.style.display = 'flex';
}

async function createRoom(apiKey) {
  const errEl = document.getElementById('setup-error');
  const btn = document.getElementById('setup-create-btn');
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '만드는 중...';
  try {
    const res = await fetch('/api/create-room', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ apiKey }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '방을 만드는 데 실패했어요.');
    ROOM_CODE = data.roomCode;
    localStorage.setItem('moral_explorer_room', ROOM_CODE);
    showRoomInfo();
  } catch (e) {
    errEl.textContent = '⚠️ ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '방 만들기';
  }
}

function wireSetupScreen() {
  document.getElementById('setup-create-btn').onclick = () => {
    const key = document.getElementById('setup-api-key').value.trim();
    if (!key) {
      document.getElementById('setup-error').textContent = '⚠️ API 키를 입력해 주세요.';
      return;
    }
    createRoom(key);
  };
  document.getElementById('room-copy-btn').onclick = () => {
    const link = buildShareUrl(ROOM_CODE);
    navigator.clipboard.writeText(link).then(() => {
      const b = document.getElementById('room-copy-btn');
      const original = b.textContent;
      b.textContent = '✅ 복사됐어요!';
      setTimeout(() => { b.textContent = original; }, 1500);
    }).catch(() => {});
  };
  document.getElementById('room-continue-btn').onclick = () => {
    hideSetupOverlay();
    showShareButton();
    startApp();
  };
  document.getElementById('room-restart-link').onclick = (e) => {
    e.preventDefault();
    localStorage.removeItem('moral_explorer_room');
    ROOM_CODE = null;
    document.getElementById('setup-api-key').value = '';
    document.getElementById('setup-error').textContent = '';
    document.getElementById('setup-step-room').style.display = 'none';
    document.getElementById('setup-step-key').style.display = 'block';
  };
}

// ---------- boot ----------
(async () => {
  await loadPrompts();
  wireSetupScreen();

  const urlParams = new URLSearchParams(window.location.search);
  const roomFromUrl = urlParams.get('room');

  if (roomFromUrl) {
    // 학생(또는 공유받은 사람): 키 입력 화면 없이 곧바로 시작. 공유 링크 버튼은 보여주지 않는다.
    ROOM_CODE = roomFromUrl.toUpperCase();
    hideSetupOverlay();
    startApp();
    return;
  }

  const savedRoom = localStorage.getItem('moral_explorer_room');
  if (savedRoom) {
    // 이전에 방을 만들어둔 선생님이 돌아온 경우: 바로 이어서 쓸 수 있게 하고, 공유 버튼도 보여준다.
    ROOM_CODE = savedRoom;
    hideSetupOverlay();
    showShareButton();
    startApp();
    return;
  }

  // 처음 접속: API 키 입력 화면을 그대로 둔다(#setup-overlay는 기본으로 표시되어 있음).
})();
</script>
