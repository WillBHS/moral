<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도덕 AI 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hi+Melody&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --chatbg: #FDEFF6;
    --chatbg2: #F6E4F7;
    --topbar: #C9A2E8;
    --topbar-text: #FFFFFF;
    --ai-bubble: #FFFFFF;
    --ai-text: #4A3A55;
    --user-bubble: #FFD3E4;
    --user-text: #6B2C4C;
    --accent: #B98CE3;
    --accent-dark: #9A6BCB;
    --meta: #B29BC7;
    --danger: #FF8FA0;
    --shadow: 0 3px 8px rgba(180,140,220,0.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #F1E4F5;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ai-text);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    height: calc(100vh - 32px);
    max-height: 900px;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at 10% 15%, rgba(255,255,255,0.5) 2px, transparent 2px) 0 0/28px 28px,
      linear-gradient(180deg, var(--chatbg) 0%, var(--chatbg2) 100%);
    box-shadow: 0 4px 28px rgba(0,0,0,0.22);
    border-radius: 24px;
    position: relative;
    overflow: hidden;
  }
  #statusbar {
    flex: 0 0 auto;
    background: var(--topbar);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 20px 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #statusbar .sb-icons { display: flex; align-items: center; gap: 5px; }
  #statusbar svg { display: block; }
  header {
    flex: 0 0 auto;
    background: linear-gradient(135deg, var(--topbar), #E3B8F0);
    color: var(--topbar-text);
    padding: 14px 16px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 3px 10px rgba(150,100,190,0.25);
    border-radius: 0 0 22px 22px;
    z-index: 5;
  }
  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    flex: 0 0 auto;
    box-shadow: 0 2px 6px rgba(150,100,190,0.3);
  }
  .head-text { flex: 1; min-width: 0; }
  .head-text .name {
    font-family: 'Hi Melody', cursive;
    font-weight: 400;
    font-size: 19px;
    line-height: 1.3;
  }
  .head-text .status {
    font-size: 12.5px;
    color: rgba(255,255,255,0.85);
    display: flex; align-items: center; gap: 4px;
  }
  .head-text .status .led {
    width: 7px; height: 7px; border-radius: 50%;
    background: #B6FFCB;
    box-shadow: 0 0 4px #B6FFCB;
  }
  #reset-btn {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 5px;
    padding: 7px 12px 7px 9px;
    border-radius: 999px;
    border: none;
    background: rgba(255,255,255,0.22);
    color: #fff;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: transform .15s, background .15s;
    white-space: nowrap;
  }
  #reset-btn .reset-icon { font-size: 15px; display: inline-block; }
  #reset-btn:hover { background: rgba(255,255,255,0.35); }
  #reset-btn:active .reset-icon { transform: rotate(-90deg); }
  #reset-btn:active { transform: scale(0.95); }
  #transcript {
    flex: 1;
    padding: 22px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .row { display: flex; flex-direction: column; margin: 5px 0; max-width: 100%; }
  .row.grouped-row { margin-top: 2px; }
  .row.ai { align-items: flex-start; }
  .row.user { align-items: flex-end; }
  .bwrap { display: flex; flex-direction: column; max-width: 84%; }
  .row.ai .bwrap { align-items: flex-start; }
  .row.user .bwrap { align-items: flex-end; }
  .timestamp {
    font-size: 10.5px;
    color: #9C8FA8;
    margin: 3px 6px 0;
  }
  .bubble {
    max-width: 100%;
    padding: 9px 13px;
    line-height: 1.5;
    font-size: 16px;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: var(--shadow);
    position: relative;
  }
  .bubble.ai {
    background: var(--ai-bubble);
    color: var(--ai-text);
    border-radius: 20px 20px 20px 6px;
  }
  .bubble.ai.grouped { border-radius: 18px; margin-bottom: 2px; }
  .bubble.ai.tight { border-top-left-radius: 18px; }
  .bubble.user {
    background: var(--user-bubble);
    color: var(--user-text);
    border-radius: 20px 20px 6px 20px;
  }
  .bubble.user.grouped { border-radius: 18px; margin-bottom: 2px; }
  .bubble.user.tight { border-top-right-radius: 18px; }
  .bubble.thinking {
    background: var(--ai-bubble);
    color: var(--meta);
    border-radius: 20px 20px 20px 6px;
    font-size: 14px;
    padding: 12px 16px;
  }
  .dot-flash { display: inline-block; }
  .dot-flash span {
    display: inline-block; width: 6px; height: 6px; margin-right: 3px;
    border-radius: 50%; background: var(--accent);
    animation: blink 1.2s infinite ease-in-out;
  }
  .dot-flash span:nth-child(2) { animation-delay: .2s; }
  .dot-flash span:nth-child(3) { animation-delay: .4s; }
  .user-dots span { background: var(--user-text); }
  .typing-bubble { padding: 10px 14px; }
  @keyframes blink { 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }
  .case-box {
    max-width: 86%;
    margin: 4px 0 2px;
    border-radius: 20px;
    padding: 15px 17px 14px;
    background: var(--ai-bubble);
    box-shadow: var(--shadow);
    font-size: 16px;
    line-height: 1.65;
    border: 2px dashed #E6C9F2;
  }
  .case-box .tag {
    display: block;
    font-family: 'Hi Melody', cursive;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 6px;
  }
  .hint {
    font-size: 13px;
    color: var(--meta);
    padding: 2px 6px 4px;
  }
  .transcript-hint {
    margin-top: 2px;
    max-width: 84%;
  }
  .todo-card {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    max-width: 84%;
    margin: 2px 0;
    padding: 10px 14px;
    border-radius: 14px;
    border: 1.5px dashed #F2B84B;
    background: #FFF6E5;
    color: #8A5A00;
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.4;
  }
  .todo-icon { flex: 0 0 auto; font-size: 15px; margin-top: 1px; }
  #inputzone {
    flex: 0 0 auto;
    background: #FBF3FA;
    padding: 16px 14px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    border-top: 2px solid #F1DCF2;
    border-radius: 22px 22px 0 0;
  }
  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
    padding: 0 2px;
  }
  button.chip {
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    font-size: 14.5px;
    padding: 9px 15px;
    border-radius: 999px;
    border: none;
    background: #F3E4FB;
    color: var(--accent-dark);
    cursor: pointer;
    box-shadow: 0 2px 4px rgba(180,140,220,0.15);
    transition: transform .1s, background .15s;
  }
  button.chip:hover { background: #E9D2F7; }
  button.chip:active { transform: scale(0.94); }
  button.chip.secondary { background: #F0F0F0; color: #8A8A8A; }
  button.chip.warn { background: #FFE1E6; color: #E0567A; }
  button.chip:disabled { opacity: .35; cursor: default; }
  .textrow {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .textrow textarea {
    flex: 1;
    resize: none;
    min-height: 40px;
    max-height: 110px;
    padding: 10px 15px;
    border-radius: 20px;
    border: none;
    background: #fff;
    color: #232323;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px;
    line-height: 1.4;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
  }
  .textrow textarea:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--accent); }
  .textrow textarea::placeholder { color: #A6A6A6; }
  .textrow button.send {
    flex: 0 0 auto;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 6px rgba(180,140,220,0.4);
  }
  .textrow button.send:disabled { opacity: .4; }
  .textrow button.send:active { transform: scale(0.92); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }

  /* ---- 설정 화면 (API 키 입력 / 방 정보) ---- */
  #setup-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: flex-start; justify-content: center;
    background: linear-gradient(160deg, #C9A2E8, #F1E4F5);
    padding: 20px;
    overflow-y: auto; /* 설정 항목이 늘어 휴대폰 화면보다 길어져도 스크롤되게 */
  }
  .setup-card {
    background: #fff;
    border-radius: 22px;
    padding: 28px 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    margin: auto 0;
  }
  .lesson-settings {
    text-align: left; background: #FBF7FD; border: 1.5px solid #EBDDF5;
    border-radius: 14px; padding: 12px 14px; margin: 6px 0 10px;
  }
  .lesson-settings .ls-title { font-weight: 700; font-size: 14px; color: var(--accent-dark); margin-bottom: 8px; }
  .lesson-settings label { display: block; font-size: 13px; color: #4A3A55; margin: 8px 0 4px; }
  .setup-card select {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 12px;
    border: 1.5px solid #E0C9F0; font-size: 14px; background: #fff; color: #3A2A45;
  }
  .lesson-settings input { margin: 6px 0 0; }
  .lesson-settings .ls-check { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; cursor: pointer; }
  .ls-check input { width: auto !important; margin: 3px 0 0 !important; flex: 0 0 auto; }
  .ls-note { font-size: 12px; color: #8A7A98; margin-top: 6px; line-height: 1.5; }
  .setup-emoji { font-size: 40px; margin-bottom: 6px; }
  .setup-card h2 { margin: 0 0 14px; font-family: 'Hi Melody', cursive; font-size: 22px; color: var(--accent-dark); }
  .setup-card p { font-size: 14px; line-height: 1.6; color: #4A3A55; margin: 0 0 14px; }
  .setup-card input {
    width: 100%; box-sizing: border-box;
    padding: 12px 14px; border-radius: 12px;
    border: 1.5px solid #E0C9F0; font-size: 14px;
    margin-bottom: 10px;
  }
  .setup-card button {
    width: 100%; padding: 13px; border-radius: 12px; border: none;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-bottom: 8px;
  }
  .setup-card button:active { transform: scale(0.98); }
  .setup-secondary-btn { background: #F0E4FA !important; color: var(--accent-dark) !important; }
  .setup-hint { font-size: 12px; color: #9C8FA8; }
  .setup-hint a { color: var(--accent-dark); }
  .setup-error { color: #E0567A; font-size: 13px; min-height: 18px; }
  .room-qr { width: 160px; height: 160px; margin: 8px auto; display: block; border-radius: 10px; }
  .room-link {
    font-size: 12px; color: #6B5A80; word-break: break-all;
    background: #F8F3FB; border-radius: 8px; padding: 8px; margin-bottom: 10px;
  }
  #share-btn {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.22);
    border: none; color: #fff; border-radius: 999px;
    font-size: 16px; width: 34px; height: 34px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="setup-overlay">
  <div class="setup-card">
    <div class="setup-emoji">🤖</div>
    <h2>도덕 AI 도우미</h2>

    <div id="setup-step-key">
      <p>선생님의 Gemini API 키를 입력해 주세요.<br>이 키는 서버에만 저장되고, 학생에게는 노출되지 않아요.</p>
      <input id="setup-api-key" type="password" placeholder="Gemini API 키 붙여넣기">
      <button id="setup-create-btn">방 만들기</button>
      <p class="setup-hint">키가 없으신가요? <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>에서 무료로 발급받을 수 있어요.</p>
      <div id="setup-error" class="setup-error"></div>
    </div>

    <div id="setup-step-room" style="display:none;">
      <p>✅ 방이 만들어졌어요! (48시간 동안 유효)</p>
      <div class="lesson-settings">
        <div class="ls-title">📚 수업 설정</div>
        <label for="lesson-virtue">탐구할 덕목</label>
        <select id="lesson-virtue"></select>
        <input id="lesson-virtue-custom" type="text" placeholder="덕목 이름을 입력하세요 (예: 책임)" style="display:none;">
        <label for="lesson-grade">학년</label>
        <select id="lesson-grade">
          <option value="">자동 (덕목의 교과서 학년)</option>
          <option value="3">3학년</option>
          <option value="4">4학년</option>
          <option value="5">5학년</option>
          <option value="6">6학년</option>
        </select>
        <div class="ls-note" id="lesson-note"></div>
        <label class="ls-check" id="lesson-skip-probe-row" style="display:none;">
          <input type="checkbox" id="lesson-skip-probe">
          <span>활동3 소크라테스식 질문을 1개로 줄이기<br><span class="ls-note" style="margin:0;">3~4학년용 옵션. 두 번째(파고드는) 질문 없이 바로 가상 상황으로 넘어가요.</span></span>
        </label>
      </div>
      <p class="setup-hint" style="margin:0 0 4px;">아래 QR·링크로 들어온 학생은 위 설정으로 시작해요.</p>
      <img id="room-qr" class="room-qr" alt="학생용 QR 코드">
      <div class="room-link" id="room-link-display"></div>
      <button id="room-copy-btn" class="setup-secondary-btn">🔗 링크 복사</button>
      <button id="room-continue-btn">확인, 테스트해볼게요 →</button>
      <p class="setup-hint" style="margin-top:10px;"><a href="#" id="room-restart-link">다른 API 키로 새로 시작하기</a></p>
    </div>
  </div>
</div>

<div id="app">
  <div id="statusbar">
    <span id="clock">9:41</span>
    <span class="sb-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="2" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="3" height="11" rx="0.5" fill="currentColor"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M8 2.2c2.1 0 4 .8 5.5 2.2l-1.4 1.4A6 6 0 0 0 8 4c-1.6 0-3.1.6-4.1 1.8L2.5 4.4C4 3 5.9 2.2 8 2.2z" fill="currentColor"/><path d="M8 6c1 0 1.9.4 2.6 1l-1.3 1.4a1.8 1.8 0 0 0-2.6 0L5.4 7A3.6 3.6 0 0 1 8 6z" fill="currentColor"/><circle cx="8" cy="9.3" r="1" fill="currentColor"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="15" height="7" rx="1.3" fill="currentColor"/><rect x="21.5" y="3.5" width="1.6" height="4" rx="0.8" fill="currentColor"/></svg>
    </span>
  </div>
  <header>
    <div class="avatar">🤖</div>
    <div class="head-text">
      <div class="name">도덕 AI 도우미</div>
      <div class="status"><span class="led"></span><span id="stage-text">최초 접속</span></div>
    </div>
    <button id="share-btn" title="학생 공유 링크 보기" onclick="showRoomInfo()" style="display:none;">🔗</button>
    <button id="reset-btn" title="대화 초기화" onclick="resetAll()"><span class="reset-icon">🔄</span>대화 초기화</button>
  </header>
  <div id="transcript"></div>
  <div id="inputzone"></div>
</div>

<script>
const STAGE_LABEL = {
  landing: '최초 접속', value: '덕목 정하기', act1_intro: '활동1 안내', act1_interest: '활동1 · 관심사',
  act1_case: '활동1 · 사례', act1_def1: '활동1 · 정의', act2_menu: '활동2 · 맥락 선택',
  act2_situation: '활동2 · 상황', act2_def2: '활동2 · 정의', act3_q1: '활동3 · 생각해보기',
  act3_situation: '활동3 · 가상 상황', end: '종료'
};

const INITIAL_STATE = {
  step: 'landing',
  value: '', interest: null,
  def1: '', def2: '',
  caseIdx: 0, cases: [], caseEasedThisSlot: false, caseAnswerRejectCount: 0,
  context: '', situationEased: false, situationHistory: [],
  q1choice: null, q1answer1: '', q1answer2: '', q1reason: '', direction: null, counterHistory: [],
  situationTexts: [], situationDirections: [], currentSituationIdx: 0,
  busy: false,
};
const state = JSON.parse(JSON.stringify(INITIAL_STATE));

// ---------- prompts (editable via prompts.json when deployed) ----------
const DEFAULT_PROMPTS = {
  "safetyRules": "[안전 규칙] 폭력·잔인한 묘사, 성적 내용, 공포·혐오, 특정 집단 비하, 불법행위 조장, 자살·학대, 정치적 편향, 게임 소재는 쓰지 않는다. 전쟁·테러·대형 참사 장면은 쓰지 않으며, 자연재해 같은 어려움은 배경으로 짧게만 언급하고 피해 장면을 묘사하지 않는다. 초등학생 인물이 현실에서 할 수 없는 일(예: 혼자 해외 모금 운동을 이끎)을 하는 설정, 작위적으로 완벽한 선인이나 악인은 쓰지 않는다. 초등 {{grade}}학년이 뉴스를 몰라도 이해할 수 있는 쉬운 수준으로 쓴다.",
  "commonChecks": [
    "본문 외에 제목·해설·점검 과정·교훈 설명이 섞여 있거나, 5문장 이상으로 길다.",
    "안전 규칙에 어긋나는 소재(폭력·잔인함, 성적 내용, 공포·혐오, 특정 집단 비하, 불법행위 조장, 자살·학대, 정치적 편향, 전쟁·대형 참사 장면, 게임)가 들어 있다.",
    "초등 {{grade}}학년이 실제로 겪거나 쉽게 이해하기 어려운 비현실적인 상황이다.",
    "관심사가 이야기를 지배하거나, 마음과 행동이 향하는 대상이 덕목의 정의에 맞지 않는다(예: 사람을 향해야 하는 덕목인데 동물만 향함).",

      "unit": "6단원 사랑, 우리를 넘어 세계로",
      "definition": "다른 나라 사람들이 처한 여러 가지 상황을 종합적으로 이해하고 해결 방안을 탐구하며, 국경과 인종을 넘어 지구촌 타자의 고통에 공감하고 인류를 사랑하는 태도",
      "guidance": "",
      "attributes": [
        "다른 나라 사람들이 처한 여러 가지 상황을 종합적으로 이해하고",
        "해결 방안을 탐구하며",
        "국경과 인종을 넘어",
        "지구촌 타자의 고통에 공감하고",
        "인류를 사랑하는 태도"
      ],
      "relatedConcepts": [
        "애국심",
        "배려",
        "동정심"
      ],
      "contexts": [
        "친구",
        "가족",
        "국가",
        "국제사회"
      ],
      "scope": "[인류애 사례의 범위 — 필수] 지도서 정의상 인류애는 국경과 인종을 넘어 지구촌 타자를 향한다. 전형적·반대·경계 사례는 다른 나라 사람들(또는 다른 나라에서 온 사람들)과 관련된 상황이어야 한다. 관련 사례는 우리 주변 사람을 향한 다른 개념이어도 된다. 해외여행 중 외국인을 돕는 장면만 반복하지 말고, 우리 동네의 외국인 이웃, 다른 나라에서 온 친구, 다른 나라 소식을 접했을 때의 반응, 국제 교류 활동 등 다양한 장면을 활용하라.",
      "notes": "",
      "extraFailChecks": {}
    }
  ]
};
let PROMPTS = DEFAULT_PROMPTS;
async function loadPrompts() {
  try {
    const res = await fetch('./prompts.json', { cache: 'no-store' });
    if (res.ok) PROMPTS = await res.json();
  } catch (e) { /* prompts.json이 없으면(예: 이 미리보기 화면) 기본값을 그대로 쓴다 */ }
}

function fillRaw(str, vars) {
  return str.replace(/\{\{(\w+)\}\}/g, (m, k) => (k in vars ? vars[k] : ''));
}
// 모든 문구에서 공통으로 쓰는 값(학년, 덕목 정보 등)은 따로 넘기지 않아도 자동으로 채운다.
function fillTemplate(str, vars = {}) {
  const g = templateGlobals();
  return str.replace(/\{\{(\w+)\}\}/g, (m, k) => (k in vars ? vars[k] : (k in g ? g[k] : '')));
}

// ---------- 덕목 프로필 (초등 도덕 교사용 지도서 기준) ----------
function normalizeVirtue(t) {
  return (t || '').replace(/[\s()（）·.,!?~'"]/g, '');
}
function findProfile(input) {
  const n = normalizeVirtue(input);
  if (!n) return null;
  return (PROMPTS.virtueProfiles || []).find(p =>
    normalizeVirtue(p.name) === n || (p.aliases || []).some(a => normalizeVirtue(a) === n)) || null;
}
function currentProfile() {
  return state.value ? findProfile(state.value) : null;
}
// 수업 설정: 교사가 방 화면에서 고른 덕목·학년. 학생은 공유 링크(?v=덕목&g=학년)로 받는다.
// 대화 초기화·되돌리기와 무관하게 유지되어야 하므로 state 밖에 둔다.
// virtue: null이면 학생이 직접 입력 / grade: null이면 덕목 프로필의 학년을 따른다.
// skipProbe: 3~4학년 수업에서 활동3의 두 번째 질문을 생략할지
const LESSON = { virtue: null, grade: null, skipProbe: false };

// 지금 수업에 실제로 적용되는 학년(교사가 고른 학년, 없으면 덕목의 교과서 학년). 모르면 null.
function effectiveGrade() {
  // 교사가 덕목을 정해 두었으면 그 덕목 기준, 학생이 직접 입력하는 수업이면 학생이 입력한 덕목 기준
  const p = LESSON.virtue ? findProfile(LESSON.virtue) : currentProfile();
  return LESSON.grade || (p ? p.grade : null);
}
function skipProbeActive() {
  return LESSON.skipProbe && ['3', '4'].includes(effectiveGrade());
}

function templateGlobals() {
  const p = currentProfile();
  const grade = LESSON.grade || (p ? p.grade : '5~6');
  const v = state.value || '';
  const b = hasBatchim(v);
  const lastCode = v ? v.trim().slice(-1).charCodeAt(0) - 0xAC00 : -1;
  const rieul = lastCode >= 0 && lastCode % 28 === 8; // ㄹ받침 뒤에는 '로'
  const g = {
    grade,
    // [덕목] 뒤에 붙는 조사(받침 유무에 맞게)
    iGa: b ? '이' : '가', eunNeun: b ? '은' : '는', eulReul: b ? '을' : '를', waGwa: b ? '과' : '와',
    ro: b && !rieul ? '으로' : '로', ida: b ? '이다' : '다', iRago: b ? '이라고' : '라고',
    gradeStyle: (PROMPTS.gradeStyles || {})[grade] || '',
    questionStyle: fillRaw((PROMPTS.questionStyles || {})[grade] || '', { grade }),
    counterGradeStyle: fillRaw((PROMPTS.counterGradeStyles || {})[grade] || '', { grade }),
    relatedConcepts: p && p.relatedConcepts && p.relatedConcepts.length ? p.relatedConcepts.join(', ') : PROMPTS.defaultRelatedConcepts,
  };
  g.virtueBlock = p
    ? fillRaw(PROMPTS.virtueBlockTemplate, {
        value: p.name, grade: p.grade, unit: p.unit, // 덕목 정보의 학년은 지도서(교과서)상의 학년 definition: p.definition,
        attributes: p.attributes.map(a => '- ' + a).join('\n'),
        guidance: p.guidance ? `[지도상 유의점(지도서 원문)] ${p.guidance}` : '',
        notes: p.notes || '', scope: p.scope || '',
      }).replace(/\n+$/, '')
    : fillRaw(PROMPTS.genericVirtueBlock, { value: state.value });
  return g;
}

// 활동2 관계 선택지: 덕목 프로필에 정해진 것을 쓰고, 없으면 기본 4개를 쓴다.
const DEFAULT_CONTEXTS = ['친구', '가족', '국가', '국제사회'];
const CONTEXT_EMOJI = { '나 자신': '🙋', '친구': '👫', '가족': '👨‍👩‍👧', '학교': '🏫', '국가': '🏘️', '국제사회': '🌍', '자연': '🌱' };
function contextList() {
  const p = currentProfile();
  const list = (p && p.contexts && p.contexts.length) ? p.contexts : DEFAULT_CONTEXTS;
  return list.map(c => typeof c === 'string'
    ? { name: c, desc: PROMPTS.situationContexts[c] || c }
    : { name: c.name, desc: c.desc || c.name });
}
function contextInfo(name) {
  return contextList().find(c => c.name === name) || { name, desc: PROMPTS.situationContexts[name] || name };
}
// 공용 관계(친구·가족 등)는 "○○ 관계 속", 덕목 전용 관계·상황(예: 효의 '부모님이 힘드실 때')은 이름 그대로 쓴다.
function ctxPhrase(name) {
  return PROMPTS.situationContexts[name] ? `${name} 관계 속` : name;
}
function contextChipLabel(name) {
  return `${CONTEXT_EMOJI[name] || '👥'} ${name}`;
}

const CASE_TYPE_KEYS = ['model', 'contrary', 'related', 'borderline'];
const CASE_TYPES = CASE_TYPE_KEYS.map(key => ({
  key,
  ask: (v) => {
    const b = hasBatchim(v);
    return fillTemplate(PROMPTS.caseTypes[key].askTemplate, {
      value: v,
      waGwa: b ? '과' : '와',
      iRago: b ? '이라고' : '라고',
    });
  },
}));

// 한글 단어의 받침 유무를 판단해 조사를 자동으로 고른다(을/를, 이/가, 와/과 등).
function hasBatchim(word) {
  if (!word) return false;
  const ch = word.trim().slice(-1);
  const code = ch.charCodeAt(0);
  if (code < 0xAC00 || code > 0xD7A3) return false; // 한글 음절이 아니면 받침 없음으로 취급
  return (code - 0xAC00) % 28 !== 0;
}
// 활동1 사례 답변 검증: AI 판정 대신, 명백히 의미 없는 답변만 규칙 기반으로 걸러낸다.
// (짧아도 뜻이 통하는 답까지 AI가 자꾸 부적절로 오판하던 문제를 근본적으로 없애기 위함)
const JUNK_ANSWERS = ['몰라요', '모름', '모르겠어요', '모르겠음', 'ㅇㅇ', 'ㄴㄴ', 'ㅁㄹ', '글쎄', '글쎄요', '그냥', '없음', '없어요', '패스'];
function isObviouslyInadequate(answer) {
  const trimmed = (answer || '').trim();
  if (!trimmed) return true;
  // 숫자만 입력(뒤에 "번", "개", 마침표·느낌표 정도만 붙은 경우까지 포함 — 예: "2", "2번", "2.")
  if (/^\d{1,2}(번|개)?[.!]?$/.test(trimmed)) return true;
  if (trimmed.replace(/\s/g, '').length <= 1) return true; // 한 글자짜리
  if (JUNK_ANSWERS.includes(trimmed)) return true; // 상투적인 무의미 답변
  return false;
}
// 활동1 사례 박스 상단에 표시할, 사례 유형별 태그 문구.
function caseTag(typeKey, value) {
  const b = hasBatchim(value);
  switch (typeKey) {
    case 'model': return `${value}${b ? '을' : '를'} 잘 보여주는 이야기`;
    case 'contrary': return `${value}${b ? '이라고' : '라고'} 말할 수 없는 이야기`;
    case 'related': return `${value}${b ? '과' : '와'} 비슷해 보이지만 다른 이야기`;
    case 'borderline': return `${value}인 것 같기도 하고, 아닌 것 같기도 한 이야기`;
    default: return '이야기';
  }
}

// 앞 이야기와 겹치지 않게 하려면 첫 문장만으로는 부족하다 — 사건의 종류나 마음을 표현한 문구는
// 보통 뒷 문장에 있기 때문이다. 이야기가 2~3문장으로 짧으므로 본문 전체(최대 250자)를 넘긴다.
function summarize(text) {
  const t = (text || '').trim().replace(/\s+/g, ' ');
  return t.length > 250 ? t.slice(0, 250) + '...' : t;
}
function avoidLine(priorSummaries) {
  if (!priorSummaries.length) return '';
  const list = priorSummaries.map((s, i) => `${i+1}. ${s}`).join('\n');
  return fillTemplate(PROMPTS.avoidLineTemplate, { list });
}

// ---------- 실패 조건(생성 규칙 = 판정 기준) ----------
// 이야기를 만드는 AI의 "최종 점검"과 판정 AI의 "실패 조건"은 prompts.json의 같은 목록에서 나온다.
// 한쪽만 고쳐서 생성 규칙과 판정 기준이 어긋나는 일이 없도록 하기 위함이다.
// spec = { kind: 'model'|'contrary'|'related'|'borderline'|'situation'|'counter', value, context?, def2?, direction? }
function kindChecks(spec) {
  let base;
  if (spec.kind === 'situation') {
    base = [...PROMPTS.situationChecks, ...((PROMPTS.contextChecks || {})[spec.context] || [])];
  } else if (spec.kind === 'counter') base = PROMPTS.counterChecks;
  else base = PROMPTS.caseTypes[spec.kind].failChecks;
  // 덕목 프로필에 그 덕목에만 해당하는 실패 조건이 있으면 덧붙인다(예: 효의 지도상 유의점).
  const p = currentProfile();
  const extra = (p && p.extraFailChecks && p.extraFailChecks[spec.kind]) || [];
  return [...base, ...extra];
}
function bulletList(items, vars) {
  return items.map(t => '- ' + fillTemplate(t, vars)).join('\n');
}
function checkVars(spec) {
  return { value: spec.value, context: spec.context || '', def2: spec.def2 || '' };
}
function allChecks(spec) {
  const vars = checkVars(spec);
  return bulletList(PROMPTS.commonChecks, vars) + '\n' + bulletList(kindChecks(spec), vars);
}
function sharedParts(value, priorSummaries, easier) {
  return {
    avoidLine: avoidLine(priorSummaries),
    easierLine: easier ? fillTemplate(PROMPTS.easierLine) : '',
    formatLine: fillTemplate(PROMPTS.formatLine),
    safetyRules: fillTemplate(PROMPTS.safetyRules),
    finalCheckIntro: fillTemplate(PROMPTS.finalCheckIntro),
  };
}

function caseTypePrompt(type, value, interest, priorSummaries, easier) {
  const t = PROMPTS.caseTypes[type];
  return fillTemplate(PROMPTS.caseGenerationTemplate, {
    value,
    typeMap: fillTemplate(PROMPTS.caseTypeMap, { value }),
    typeDefinition: fillTemplate(t.definition, { value }),
    typeMind: fillTemplate(t.mind, { value }),
    interestLine: interest ? fillTemplate(PROMPTS.interestLineWithInterest, { interest }) : PROMPTS.interestLineWithout,
    ...sharedParts(value, priorSummaries, easier),
    checks: allChecks({ kind: type, value }),
  });
}

function situationPrompt(value, context, priorSummaries, easier) {
  const scopeLine = context === '국제사회' ? fillTemplate(PROMPTS.internationalScopeLine, { value })
    : context === '국가' ? fillTemplate(PROMPTS.civicScopeLine, { value }) : '';
  return fillTemplate(PROMPTS.situationTemplate, {
    value, context,
    contextDesc: contextInfo(context).desc,
    scopeLine,
    ...sharedParts(value, priorSummaries, easier),
    checks: allChecks({ kind: 'situation', value, context }),
  });
}

function q1FollowupPrompt(value, def2, choiceLabel) {
  return fillTemplate(PROMPTS.q1FollowupTemplate, { value, def2, choiceLabel });
}

function q1ProbePrompt(value, def2, answer) {
  return fillTemplate(PROMPTS.q1ProbeTemplate, { value, def2, answer });
}

function counterDirectionDesc(direction, def2) {
  return fillTemplate(direction === 'A' ? PROMPTS.counterDirectionA : PROMPTS.counterDirectionB, { def2 });
}

function counterPrompt(value, def2, direction, reasonText, priorSummaries) {
  return fillTemplate(PROMPTS.counterTemplate, {
    value, def2, reasonText,
    directionDesc: counterDirectionDesc(direction, def2),
    ...sharedParts(value, priorSummaries, false),
    checks: allChecks({ kind: 'counter', value, def2, direction }),
  });
}

function interestExamplesPrompt(value) {
  return fillTemplate(PROMPTS.interestExamplesTemplate, { value, pool: PROMPTS.interestPool.join(', ') });
}

function virtueCheckPrompt(word) {
  return fillTemplate(PROMPTS.virtueCheckTemplate, { word });
}

// ---------- 사례 검수(판정 AI) ----------
// 학생에게 보여줄 모든 이야기는 "생성 → 판정 → (탈락 시) 문제를 알려주고 재생성" 과정을 거친다.
// spec = { kind: 'model'|'contrary'|'related'|'borderline'|'situation'|'counter',
//          value, context?(활동2), def2?, direction?(활동3) }
const MAX_GEN_ATTEMPTS = 2; // 최초 생성 1회 + 재생성 1회. 더 늘리면 학생 대기 시간이 길어진다.

function judgePrompt(story, spec) {
  const vars = {
    ...checkVars(spec),
    directionDesc: spec.kind === 'counter' ? counterDirectionDesc(spec.direction, spec.def2 || '') : '',
  };
  return fillTemplate(PROMPTS.judgeTemplate, {
    value: spec.value,
    kindLabel: fillTemplate(PROMPTS.judgeKindLabels[spec.kind], vars),
    story,
    common: bulletList(PROMPTS.commonChecks, vars),
    criteria: bulletList(kindChecks(spec), vars),
  });
}

// 판정 결과 해석. 판정 호출 자체가 실패하거나 형식을 알아볼 수 없으면 "통과"로 처리한다 —
// 판정 AI의 문제 때문에 수업 진행이 막히면 안 되기 때문이다.
function parseJudgeResult(raw) {
  const t = (raw || '').trim();
  const m = t.match(/판정[^\n]{0,10}?(통과|실패)/);
  if (!m) return { pass: true, reason: '', unreadable: true };
  if (m[1] === '통과') return { pass: true, reason: '' };
  const r = t.match(/문제[^\n:：]{0,4}[:：]\s*(.+)/);
  return { pass: false, reason: r ? r[1].replace(/\*/g, '').trim() : '기준에 맞지 않음' };
}

async function judgeStory(story, spec) {
  if (!story || story.length < 10) return { pass: false, reason: '이야기가 비어 있거나 너무 짧음' };
  try {
    return parseJudgeResult(await ask(judgePrompt(story, spec), 'quick'));
  } catch (e) {
    return { pass: true, reason: '', skipped: true };
  }
}

async function generateVerified(basePrompt, spec) {
  let draft = '', verdict = null;
  for (let attempt = 1; attempt <= MAX_GEN_ATTEMPTS; attempt++) {
    const prompt = attempt === 1
      ? basePrompt
      : basePrompt + fillTemplate(PROMPTS.retryFeedbackTemplate, { reason: verdict.reason, draft });
    draft = await ask(prompt); // 생성 자체의 실패(네트워크 등)는 호출한 쪽에서 처리한다.
    verdict = await judgeStory(draft, spec);
    // 교사가 브라우저 개발자 도구(F12 → Console)에서 검수 과정을 확인할 수 있게 남긴다.
    console.info(`[사례 검수] ${spec.kind} ${attempt}차: ${verdict.pass ? '통과' : '탈락 — ' + verdict.reason}`
      + (verdict.skipped ? ' (판정 호출 실패로 통과 처리)' : '') + (verdict.unreadable ? ' (판정 형식 오류로 통과 처리)' : ''));
    if (verdict.pass) return draft;
  }
  // 재생성까지 탈락하면, 탈락 사유를 반영해 다시 쓴 마지막 초안을 사용한다.
  console.warn(`[사례 검수] ${spec.kind}: 재생성 후에도 탈락 — 마지막 초안을 그대로 사용합니다.`);
  return draft;
}

// 방 코드(교사가 만들거나, 학생이 링크로 전달받은 값)를 통해 서버(/api/chat)를 거쳐
// AI를 호출한다. 실제 API 키는 서버에만 있고 이 브라우저에는 전혀 내려오지 않는다.
let ROOM_CODE = null;

async function ask(prompt, tier = 'default') {
  if (!ROOM_CODE) throw new Error('방 코드가 없습니다.');
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ roomCode: ROOM_CODE, prompt, tier }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    // 문제 진단용: 실제 실패 원인을 브라우저 콘솔(F12 → Console)에서 확인할 수 있게 남긴다.
    console.error('AI 호출 실패:', res.status, data.error, data.detail || '');
    throw new Error(data.error || 'API 요청에 실패했어요.');
  }
  return (data.text || '').trim();
}

// ---------- rendering ----------
const transcriptEl = document.getElementById('transcript');
const inputzoneEl = document.getElementById('inputzone');
const stageTextEl = document.getElementById('stage-text');
let log = [];

function scrollToBottom() {
  transcriptEl.scrollTop = transcriptEl.scrollHeight + 999;
}
// inputzone(버튼/질문/입력창)의 높이가 나중에 바뀌어도(예: 사례 제공 직후 질문·버튼이 추가되며 커질 때)
// 대화창이 항상 맨 아래에 고정되도록 크기 변화를 감지해서 재조정한다.
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => scrollToBottom()).observe(inputzoneEl);
}

function pushAI(text, opts = {}) {
  log.push({ who: 'ai', text, box: !!opts.box, hint: !!opts.hint, tag: opts.tag || null, ts: Date.now() });
  renderLog();
}
function pushTodo(text) {
  log.push({ who: 'ai', text, todo: true, ts: Date.now() });
  renderLog();
}
function pushUser(text) {
  log.push({ who: 'user', text, ts: Date.now() });
  renderLog();
}
function pushThinking(id) {
  log.push({ who: 'thinking', text: '', id });
  renderLog();
}
function popThinking(id) {
  log = log.filter(l => !(l.who === 'thinking' && l.id === id));
  renderLog();
}
// 학생이 입력창에 뭔가 타이핑 중일 때, 실제 메신저처럼 학생 쪽에 "입력 중..." 점 3개 말풍선을 보여준다.
let userTypingId = null;
function showUserTyping() {
  if (userTypingId) return;
  userTypingId = 'utyping' + Date.now();
  log.push({ who: 'user', typing: true, id: userTypingId });
  renderLog();
}
function hideUserTyping() {
  if (!userTypingId) return;
  log = log.filter(l => l.id !== userTypingId);
  userTypingId = null;
  renderLog();
}
// 텍스트 입력창에 입력 중 표시 로직을 붙여준다.
function wireTypingIndicator(ta) {
  ta.addEventListener('input', () => {
    if (ta.value.trim()) showUserTyping();
    else hideUserTyping();
  });
}
function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
// 버튼 그룹 중복 클릭 방지: 하나라도 누르면 그룹 전체를 즉시 비활성화한다.
function guardClick(buttons, fn) {
  return () => {
    if (buttons.some(b => b.disabled)) return;
    buttons.forEach(b => { b.disabled = true; });
    fn();
  };
}
// 여러 메시지를 연달아 보여줄 때, 실제 사람이 메시지를 하나씩 보내는 것처럼
// 짧은 "타이핑 중" 표시 후 하나씩 자연스럽게 등장시킨다.
async function sayAI(text, opts = {}) {
  const tid = 'say' + Date.now() + Math.random();
  pushThinking(tid);
  await sleep(450 + Math.random() * 250);
  popThinking(tid);
  pushAI(text, opts);
  await sleep(120);
}
async function sayTodo(text) {
  const tid = 'say' + Date.now() + Math.random();
  pushThinking(tid);
  await sleep(400 + Math.random() * 200);
  popThinking(tid);
  pushTodo(text);
  await sleep(120);
}
function fmtTime(ts) {
  const d = new Date(ts);
  const h = d.getHours(), m = d.getMinutes();
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function renderLog() {
  transcriptEl.innerHTML = '';
  log.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'row ' + (item.who === 'user' ? 'user' : 'ai');
    if (item.who === 'thinking') {
      const d = document.createElement('div');
      d.className = 'bubble thinking';
      d.innerHTML = '<span class="dot-flash"><span></span><span></span><span></span></span>';
      row.appendChild(d);
      transcriptEl.appendChild(row);
      return;
    }
    if (item.typing) {
      const d = document.createElement('div');
      d.className = 'bubble user typing-bubble';
      d.innerHTML = '<span class="dot-flash user-dots"><span></span><span></span><span></span></span>';
      row.appendChild(d);
      transcriptEl.appendChild(row);
      return;
    }
    if (item.box) {
      const box = document.createElement('div');
      box.className = 'case-box';
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = item.tag ? ('📖 ' + item.tag) : '📖 이야기';
      box.appendChild(tag);
      box.appendChild(document.createTextNode(item.text));
      row.appendChild(box);
      transcriptEl.appendChild(row);
      return;
    }
    if (item.hint) {
      const h = document.createElement('div');
      h.className = 'hint transcript-hint';
      h.textContent = item.text;
      row.appendChild(h);
      transcriptEl.appendChild(row);
      return;
    }
    if (item.todo) {
      const t = document.createElement('div');
      t.className = 'todo-card';
      const icon = document.createElement('span');
      icon.className = 'todo-icon';
      icon.textContent = '☑️';
      const txt = document.createElement('span');
      txt.textContent = item.text;
      t.appendChild(icon);
      t.appendChild(txt);
      row.appendChild(t);
      transcriptEl.appendChild(row);
      return;
    }
    const prev = log[i - 1];
    const next = log[i + 1];
    const groupedWithPrev = prev && prev.who === item.who && !prev.box && prev.who !== 'thinking';
    const groupedWithNext = next && next.who === item.who && !next.box && next.who !== 'thinking';
    if (groupedWithPrev) row.classList.add('grouped-row');
    const wrap = document.createElement('div');
    wrap.className = 'bwrap';
    const d = document.createElement('div');
    d.className = 'bubble ' + (item.who === 'ai' ? 'ai' : 'user') + (groupedWithNext ? ' grouped' : '') + (groupedWithPrev ? ' tight' : '');
    d.textContent = item.text;
    wrap.appendChild(d);
    if (!groupedWithNext) {
      const t = document.createElement('span');
      t.className = 'timestamp';
      t.textContent = fmtTime(item.ts || Date.now());
      wrap.appendChild(t);
    }
    row.appendChild(wrap);
    transcriptEl.appendChild(row);
  });
  scrollToBottom();
  if (stageTextEl) stageTextEl.textContent = STAGE_LABEL[state.step] || '';
}

function setInputChips(chips) {
  inputzoneEl.innerHTML = '';
  hideUserTyping();
  renderUndoRow();
  const row = document.createElement('div');
  row.className = 'choices';
  const allButtons = [];
  chips.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (c.variant ? ' ' + c.variant : '');
    b.textContent = c.label;
    b.disabled = state.busy || !!c.disabled;
    b.onclick = () => {
      if (b.disabled) return;
      allButtons.forEach(btn => { btn.disabled = true; }); // 중복 클릭 방지: 누르는 즉시 전부 비활성화
      c.onClick();
    };
    allButtons.push(b);
    row.appendChild(b);
  });
  inputzoneEl.appendChild(row);
  saveCheckpoint(() => setInputChips(chips));
}

function setInputText(placeholder, onSubmit, opts = {}) {
  inputzoneEl.innerHTML = '';
  hideUserTyping();
  renderUndoRow();
  if (opts.chipsAbove) {
    const row = document.createElement('div');
    row.className = 'choices';
    opts.chipsAbove.forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip' + (c.variant ? ' ' + c.variant : '');
      b.textContent = c.label;
      b.disabled = state.busy || !!c.disabled;
      b.onclick = () => c.onClick();
      row.appendChild(b);
    });
    inputzoneEl.appendChild(row);
  }
  const trow = document.createElement('div');
  trow.className = 'textrow';
  const ta = document.createElement('textarea');
  ta.placeholder = placeholder;
  ta.disabled = state.busy;
  const btn = document.createElement('button');
  btn.className = 'send';
  btn.innerHTML = '&#10148;';
  btn.disabled = state.busy;
  const submit = () => {
    const v = ta.value.trim();
    if (!v || state.busy || btn.disabled) return;
    hideUserTyping();
    btn.disabled = true;
    ta.disabled = true;
    onSubmit(v);
  };
  btn.onclick = submit;
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  wireTypingIndicator(ta);
  trow.appendChild(ta);
  trow.appendChild(btn);
  inputzoneEl.appendChild(trow);
  ta.focus();
  if (opts.checkpoint !== false) {
    saveCheckpoint(() => setInputText(placeholder, onSubmit, opts));
  }
}

function setBusy(v) { state.busy = v; }

// ---------- undo (되돌리기) ----------
let checkpoint = null;
function saveCheckpoint(redo) {
  checkpoint = { state: JSON.parse(JSON.stringify(state)), logLen: log.length, redo };
}
function renderUndoRow(extraChips = []) {
  // ⚠ 이 화면을 그리는 함수가 끝나면서 saveCheckpoint()를 다시 호출해 checkpoint를
  // "지금 이 화면"으로 덮어쓰기 때문에, 버튼 클릭 시점에 전역 checkpoint를 읽으면
  // 항상 "자기 자신"을 다시 그리는 것으로 귀결되는 버그가 있었다.
  // → 버튼을 만드는 지금 이 순간의 checkpoint를 스냅샷으로 따로 붙잡아,
  //    나중에 전역값이 바뀌어도 이 버튼은 그 스냅샷(=진짜 직전 화면)만 쓰도록 고정한다.
  const snapshot = checkpoint;
  if (!snapshot && extraChips.length === 0) return;
  const row = document.createElement('div');
  row.className = 'choices';
  const allButtons = [];
  if (snapshot) {
    const b = document.createElement('button');
    b.className = 'chip secondary';
    b.textContent = '↩️ 이전 답 다시 쓰기';
    b.onclick = () => { if (b.disabled) return; allButtons.forEach(btn => { btn.disabled = true; }); undoTo(snapshot); };
    allButtons.push(b);
    row.appendChild(b);
  }
  extraChips.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (c.variant ? ' ' + c.variant : '');
    b.textContent = c.label;
    b.onclick = () => { if (b.disabled) return; allButtons.forEach(btn => { btn.disabled = true; }); c.onClick(); };
    allButtons.push(b);
    row.appendChild(b);
  });
  inputzoneEl.appendChild(row);
}
function undoTo(snapshot) {
  if (!snapshot) return;
  if (checkpoint === snapshot) checkpoint = null; // 스냅샷이 여전히 최신 checkpoint라면 정리
  Object.keys(state).forEach(k => { delete state[k]; });
  Object.assign(state, JSON.parse(JSON.stringify(snapshot.state)));
  log.length = snapshot.logLen;
  renderLog();
  snapshot.redo();
}

// ---------- flow ----------
async function startApp() {
  appStarted = true;
  appliedLessonSig = lessonSig();
  await sayAI(`👋 안녕하세요! 저는 여러분의 도덕 수업을 도와주는 AI 도우미예요. 오늘 함께 탐구할 덕목과 관련된 다양한 사례와 상황을 제공해 줄게요.`);
  await sayAI(`🧠 하지만 중요한 판단은 언제나 여러분이 직접 해야 해요. 지금부터 저와 함께 의미 있는 도덕 수업을 만들어 보아요!`);
  setInputChips([{ label: '✏️ 시작할게요', onClick: onStartClicked }]);
}

function onStartClicked() {
  pushUser('시작할게요');
  if (LESSON.virtue) {
    if (!findProfile(LESSON.virtue)) console.info(`[덕목] "${LESSON.virtue}"은(는) 지도서 정의가 등록되지 않은 덕목입니다 — 일반 모드로 진행합니다.`);
    beginWithValue(findProfile(LESSON.virtue) ? findProfile(LESSON.virtue).name : LESSON.virtue, true);
    return;
  }
  state.step = 'value';
  pushAI(`🌱 오늘 탐구할 덕목을 알려주세요!
예) 인류애, 공정, 배려, 정직, 봉사…

👉 덕목 단어 하나만 입력하면 돼요!`);
  setInputText('예: 인류애', onValueSubmit);
}

async function onValueSubmit(v) {
  pushUser(v);
  let trimmed = v.trim();

  // 지도서 정의가 등록된 덕목이면 AI 확인 없이 바로 쓴다(이름은 지도서 표기로 맞춘다).
  // 등록되지 않은 단어만 AI로 도덕적 가치인지 확인한다.
  const profile = findProfile(trimmed);
  let valid = true;
  if (profile) {
    trimmed = profile.name;
  } else {
    setBusy(true);
    const tid = 't' + Date.now();
    pushThinking(tid);
    try {
      const verdict = await ask(virtueCheckPrompt(trimmed), 'quick');
      valid = !verdict.includes('부적절');
    } catch (e) {
      console.error('덕목 검증 중 오류:', e);
      // 검증 자체가 실패해도 수업 흐름이 막히지 않도록 통과시킨다.
    }
    popThinking(tid);
    setBusy(false);
    if (valid) console.info(`[덕목] "${trimmed}"은(는) 지도서 정의가 등록되지 않은 덕목입니다 — 일반 모드로 진행합니다.`);
  }

  if (!valid) {
    pushAI('🤔 그건 이 수업에서 다룰 도덕적 가치로 보기 어려워요. 다른 덕목을 입력해 줄래요? (예: 인류애, 정직, 배려, 봉사)');
    setInputText('예: 인류애', onValueSubmit);
    return;
  }

  await beginWithValue(trimmed, false);
}

// 덕목이 정해진 뒤의 안내. fromLesson=true는 교사가 수업 설정에서 미리 정해둔 경우다.
async function beginWithValue(name, fromLesson) {
  state.value = name;
  state.step = 'act1_intro';
  const intro = fromLesson
    ? `🌟 오늘 우리가 함께 탐구할 덕목은 [${name}]${hasBatchim(name) ? '이에요' : '예요'}!`
    : `🌟 오늘 우리가 함께 탐구할 덕목은 바로 [${name}]군요!`;
  await sayAI(`${intro}

🔍 [${state.value}]${hasBatchim(state.value) ? '이' : '가'} 무엇인지, 어떤 상황에서 어떤 의미를 가지는지 지금부터 함께 깊이 탐구해볼 거예요.`);
  await sayAI(`✋ 잠깐! 지금은 AI의 도움보다 내 생각이 가장 먼저예요!

📒 내가 알고 있는 [${state.value}]${hasBatchim(state.value) ? '과' : '와'} 관련있는 사례를 떠올려보세요.`);
  await sayTodo('활동지 ①에 먼저 써보세요. 🖊️');
  setInputChips([{ label: '🤖 다 썼어요, 사례 보여주세요', onClick: onCaseRequest }]);
}

function onCaseRequest() {
  pushUser('다 썼어요, 사례 보여주세요');
  state.step = 'act1_interest';
  askInterestExamples();
}

async function askInterestExamples() {
  setBusy(true);
  const tid = 't' + Date.now();
  pushThinking(tid);
  let examples = ['동물', '운동', '음악', '미술', '요리', '여행'];
  try {
    const text = await ask(interestExamplesPrompt(state.value), 'default');
    const parts = text.split(',').map(s => s.trim()).filter(Boolean);
    const clean = parts.filter(p => PROMPTS.interestPool.includes(p));
    if (clean.length >= 4) examples = clean.slice(0, 6);
  } catch (e) { /* fall back to defaults */ }
  popThinking(tid);
  setBusy(false);
  pushAI(`🎯 여러분에게 좀 더 와닿는 사례를 제공하기 위해 한 가지만 물어볼게요!

❓평소에 어떤 분야에 관심이 있나요? 아래 중에서 골라주세요!`);
  const chips = examples.map(ex => ({ label: ex, onClick: () => onInterestPick(ex) }));
  chips.push({ label: '없어요', variant: 'secondary', onClick: () => onInterestPick('없어요') });
  setInputChips(chips);
}

function onInterestPick(v) {
  pushUser(v);
  const isNone = PROMPTS.noneWords.some(w => v.includes(w));
  if (isNone) {
    state.interest = null;
    pushAI('알겠어요! 그럼 다양한 일상 사례로 시작해볼게요 😊');
  } else {
    state.interest = v;
  }
  beginCases();
}

function beginCases() {
  state.caseIdx = 0;
  state.cases = [];
  state.caseEasedThisSlot = false;
  state.caseAnswerRejectCount = 0;
  generateAndShowCase();
}

// idx번째 사례를 만들 때 필요한 조건을 지금 상태에서 계산한다.
// key는 이 조건들을 합친 값으로, 미리 만들어 둔 사례가 지금 조건과 같은지 비교하는 데 쓴다.
function planCase(idx, easier) {
  const type = CASE_TYPES[idx];
  const priorSummaries = state.cases.map(c => summarize(c.text));
  const key = JSON.stringify([idx, easier, state.value, state.interest, priorSummaries]);
  return { idx, type, easier, priorSummaries, key };
}

function produceCase(plan) {
  const p = caseTypePrompt(plan.type.key, state.value, state.interest, plan.priorSummaries, plan.easier);
  return generateVerified(p, { kind: plan.type.key, value: state.value });
}

// 학생이 지금 사례를 읽고 답을 쓰는 동안 다음 사례를 미리 만들고 검수해 둔다.
// 검수 과정이 추가되어도 "다음 사례 만나러 가기"를 누른 뒤 기다리는 시간이 늘지 않게 하기 위함이다.
// 되돌리기·다른 사례로 바꾸기·초기화로 조건이 바뀌면 key가 달라져 미리 만든 것은 쓰지 않는다.
let casePrefetch = null; // { key, promise }
function startCasePrefetch() {
  casePrefetch = null;
  const nextIdx = state.caseIdx + 1;
  if (nextIdx >= CASE_TYPES.length) return;
  const plan = planCase(nextIdx, false);
  const promise = produceCase(plan);
  promise.catch(() => {}); // 실패는 실제로 꺼내 쓸 때 처리한다
  casePrefetch = { key: plan.key, promise };
}

async function generateAndShowCase(easier = false) {
  state.step = 'act1_case';
  setBusy(true);
  const tid = 't' + Date.now();
  pushThinking(tid);
  const idx = state.caseIdx;
  const type = CASE_TYPES[idx];
  const plan = planCase(idx, easier);
  let text;
  try {
    if (casePrefetch && casePrefetch.key === plan.key) {
      const pf = casePrefetch;
      casePrefetch = null;
      text = await pf.promise;
    } else {
      text = await produceCase(plan);
    }
  } catch (e) {
    text = '(이야기를 만드는 데 문제가 생겼어요. 다시 시도해 주세요.)';
  }
  popThinking(tid);
  setBusy(false);

  state.cases.push({ text });
  startCasePrefetch();

  const ordinal = ['첫','두','세','네'][idx] + ' 번째';
  await sayAI(`📖 ${ordinal} 사례예요 (${idx+1}/4):`);
  await sayAI(text, { box: true, tag: caseTag(type.key, state.value) });
  renderCaseInputArea();
}

function onHarderCaseComplain() {
  if (!state.caseEasedThisSlot) {
    pushUser('사례가 어려워요');
    state.caseEasedThisSlot = true;
    pushAI('알겠어요, 조금 더 쉬운 사례로 바꿔드릴게요 🔄');
    generateAndShowCase(true);
  } else {
    pushUser('다른 사례로 바꿔주세요');
    pushAI('새로운 사례로 보여드릴게요 🔄');
    generateAndShowCase(false);
  }
}

function renderCaseInputArea() {
  const type = CASE_TYPES[state.caseIdx];
  const q = type.ask(state.value);
  inputzoneEl.innerHTML = '';
  hideUserTyping();
  const chipLabel = state.caseEasedThisSlot ? '🔄 다른 사례로 바꿔볼래요' : '😵 사례가 어려워요';
  const extraChips = [{ label: chipLabel, variant: 'secondary', onClick: onHarderCaseComplain }];
  renderUndoRow(extraChips);
  const qEl = document.createElement('div');
  qEl.className = 'bubble ai';
  qEl.style.margin = '6px 0';
  qEl.textContent = '🤔 ' + q;
  inputzoneEl.appendChild(qEl);
  const trow = document.createElement('div');
  trow.className = 'textrow';
  const ta = document.createElement('textarea');
  ta.placeholder = '내 생각을 적어보세요';
  const btn = document.createElement('button');
  btn.className = 'send';
  btn.innerHTML = '&#10148;';
  const submit = () => { const v = ta.value.trim(); if (v && !btn.disabled) { hideUserTyping(); btn.disabled = true; ta.disabled = true; onCaseAnswer(v); } };
  btn.onclick = submit;
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });

// 활동1 사례 탐구질문에 대한 반응 — Green 단계 원칙상 AI가 학생 생각에 개입하면 안 되므로,
// 내용과 무관한 짧은 확인 멘트를 미리 정해둔 목록에서 무작위로 고른다(AI 생성 불필요).
const MIRROR_REPLIES = ['네, 잘 들었어요.', '알겠어요.', '적어주셔서 고마워요.', '확인했어요.', '그렇군요.'];
let lastMirrorIdx = -1;
function pickMirrorReply() {
  let idx;
  do { idx = Math.floor(Math.random() * MIRROR_REPLIES.length); } while (idx === lastMirrorIdx && MIRROR_REPLIES.length > 1);
  lastMirrorIdx = idx;
  return MIRROR_REPLIES[idx];
}

async function onCaseAnswer(v) {
  pushUser(v);
  setBusy(true);
  inputzoneEl.innerHTML = '';

  // 이 검증은 AI 판단이 아니라 명백한 무의미 입력(숫자만, 한 글자, 상투어)만 규칙으로 걸러내는 것이라
  // 오탐(정상 답을 잘못 막는) 위험이 없다. 그래서 "1회 제한" 같은 예외 없이 몇 번이든 항상 적용한다.
  const adequate = !isObviouslyInadequate(v);

  if (!adequate) {
    setBusy(false);
    state.caseAnswerRejectCount++;
    pushAI('🤔 조금 더 자세히 생각을 들려줄 수 있을까요? 왜 그렇게 느꼈는지 궁금해요!');
    renderCaseInputArea();
    return;
  }

  setBusy(false);
  pushAI(pickMirrorReply());
  await sleep(300);

  const isLast = state.caseIdx === 3;
  if (!isLast) {
    await sayTodo('함께 탐구한 내용을 활동지에도 기록했나요?');
    const nextOrdinal = ['두','세','네'][state.caseIdx];
    setInputChips([{ label: `👀 ${nextOrdinal} 번째 사례 만나러 가기`, onClick: () => {
      pushUser(`${nextOrdinal} 번째 사례 만나러 갈게요`);
      state.caseIdx++;
      state.caseEasedThisSlot = false;
      state.caseAnswerRejectCount = 0;
      generateAndShowCase();
    }}]);
  } else {
    pushAI(`✨ 네 가지 사례를 모두 살펴봤어요!

네 가지 사례를 탐구해보니, [${state.value}]의 뜻이 무엇인지 알 것 같나요?
[${state.value}] 뜻을 적어 보세요! ✏️`);
    state.step = 'act1_def1';
    setInputText('내가 생각하는 뜻을 적어보세요', onDef1Submit);
  }
}

const Q1_FALLBACK = {
  1: '어떤 점 때문에 이 뜻이 어떤 상황에서도 다 맞을 거라고 생각했어요?',

  3: '어떤 부분이 헷갈렸는지 말해줄 수 있나요?',
};

async function onQ1Pick(n) {
  const labels = { 1: '모든 상황에서 맞는다', 2: '맞지 않는 상황이 있을 수도 있다', 3: '모르겠다' };
  pushUser(labels[n]);
  state.q1choice = n;
  if (n === 1) state.direction = 'A';
  else if (n === 2) state.direction = 'B';
  setBusy(true);
  const tid = 't' + Date.now();
  pushThinking(tid);
  let q = Q1_FALLBACK[n];
  try { q = await ask(q1FollowupPrompt(state.value, state.def2, labels[n]), 'quick'); } catch (e) {}
  popThinking(tid);
  setBusy(false);
  pushAI('🤔 ' + q);
  setInputText('내 생각을 적어보세요', onQ1FollowupSubmit);
}

  if (skipProbeActive()) {

  pushUser(v);

  const tid = 't' + Date.now();
  pushThinking(tid);
  let q2 = '그 생각을 조금 더 자세히 들려줄 수 있을까요?';
  try { q2 = await ask(q1ProbePrompt(state.value, state.def2, v), 'quick'); } catch (e) {}

async function finishQ1Dialogue(v) {
  state.q1answer2 = v;
  state.q1reason = (state.q1answer1 + ' ' + state.q1answer2).trim();
  if (state.direction === null) {
    state.direction = /맞|어렵|헷갈리는게 없|그래도/.test(state.q1reason) ? 'A' : 'B';
  }
  await sayTodo('지금까지 저와 함께 나눈 대화를 활동지 ⑦에 정리해 주세요.');
  await sayAI('👀 이제 가상 상황을 만나러 가볼까요?');

  setInputChips([{ label: '🟡 가상 상황 보기', onClick: onAct3Situation }]);
}

async function onAct3Situation(userMsg) {
  pushUser(userMsg || '가상 상황 보여주세요');
  setBusy(true);
  const tid = 't' + Date.now();
  pushThinking(tid);
  // 활동1 사례 + 활동2 상황 + 지금까지 나온 활동3 가상 상황을 전부 합쳐서 겹치지 않게 한다.
  const priorSummaries = [
    ...state.cases.map(c => summarize(c.text)),
    ...state.situationHistory.map(s => summarize(s)),
    ...state.counterHistory.map(s => summarize(s)),
  ];
  let textA, textB;
  // 상황1·상황2를 순서대로 만들면 그만큼 오래 걸리므로, 동시에 병렬로 요청한다.
  // (B가 A를 회피 목록에 참고하지 못하게 되는 대신, 방향 자체가 서로 달라서 겹칠 위험은 낮다.)
  [textA, textB] = await Promise.all([
    generateVerified(counterPrompt(state.value, state.def2, 'A', state.q1reason, priorSummaries),
      { kind: 'counter', value: state.value, def2: state.def2, direction: 'A' })
      .catch(() => '(이야기를 만드는 데 문제가 생겼어요.)'),
    generateVerified(counterPrompt(state.value, state.def2, 'B', state.q1reason, priorSummaries),
      { kind: 'counter', value: state.value, def2: state.def2, direction: 'B' })
      .catch(() => '(이야기를 만드는 데 문제가 생겼어요.)'),
  ]);
  popThinking(tid);
  setBusy(false);
  state.counterHistory.push(textA, textB);
  // 방향(A/B)을 학생마다 항상 같은 순서로 보여주면 "1번은 늘 이런 상황"이라는 고정관념이
  // 생길 수 있으므로, 제시 순서를 무작위로 섞는다.
  const flip = Math.random() < 0.5;
  state.situationTexts = flip ? [textB, textA] : [textA, textB];
  state.situationDirections = flip ? ['B', 'A'] : ['A', 'B'];
  state.currentSituationIdx = 0;
  await showCurrentSituation();
}

async function showCurrentSituation() {
  const idx = state.currentSituationIdx;
  await sayAI(`🟡 가상 상황${idx + 1}이에요. 내가 정리한 [${state.value}]의 뜻이 잘 적용되는지 확인해 보세요.`);
  await sayAI(state.situationTexts[idx], { box: true, tag: `가상 상황${idx + 1}` });
  renderSituationJudgmentChoice();
}

// 가상 상황(현재 보고 있는 것 하나만) 다른 버전으로 재생성.
async function onRegenCurrentSituation() {
  pushUser('다른 가상 상황으로 보여주세요');
  setBusy(true);
  const tid = 't' + Date.now();
  pushThinking(tid);
  const idx = state.currentSituationIdx;
  const otherText = state.situationTexts[1 - idx];
  const priorSummaries = [
    ...state.cases.map(c => summarize(c.text)),
    ...state.situationHistory.map(s => summarize(s)),
    ...state.counterHistory.map(s => summarize(s)),
    ...(otherText ? [summarize(otherText)] : []),
  ];
  let text;
  const dir = state.situationDirections[idx];
  try {
    text = await generateVerified(counterPrompt(state.value, state.def2, dir, state.q1reason, priorSummaries),
      { kind: 'counter', value: state.value, def2: state.def2, direction: dir });
  }
  catch (e) { text = '(이야기를 만드는 데 문제가 생겼어요.)'; }
  popThinking(tid);
  setBusy(false);
  state.situationTexts[idx] = text;
  state.counterHistory.push(text);
  await sayAI(`🟡 다른 가상 상황${idx + 1}이에요:`);
  await sayAI(text, { box: true, tag: `가상 상황${idx + 1}` });
  renderSituationJudgmentChoice();
}

// ---------- 방(room) 관리: API 키 등록 / 공유 링크·QR / 학생 접속 ----------
function buildShareUrl(code) {
  const url = new URL(window.location.href);
  url.search = '';
  url.hash = '';
  url.searchParams.set('room', code);
  if (LESSON.virtue) url.searchParams.set('v', LESSON.virtue);
  if (LESSON.grade) url.searchParams.set('g', LESSON.grade);
  if (skipProbeActive()) url.searchParams.set('q', '1');
  return url.toString();
}

  const etc = document.createElement('optgroup');
  etc.label = '기타';
  [[VIRTUE_CUSTOM, '✏️ 목록에 없는 덕목 직접 입력'], [VIRTUE_STUDENT, '🙋 학생이 직접 입력하게 하기']].forEach(([v, t]) => {
    const o = document.createElement('option'); o.value = v; o.textContent = t; etc.appendChild(o);
  });
  sel.appendChild(etc);
}

// LESSON 값을 화면의 선택 상자에 반영
function renderLessonControls() {
  const sel = document.getElementById('lesson-virtue');
  const custom = document.getElementById('lesson-virtue-custom');
  const p = LESSON.virtue ? findProfile(LESSON.virtue) : null;
  if (!LESSON.virtue) { sel.value = VIRTUE_STUDENT; custom.style.display = 'none'; }
  else if (p) { sel.value = p.name; custom.style.display = 'none'; }
  else { sel.value = VIRTUE_CUSTOM; custom.style.display = 'block'; custom.value = LESSON.virtue; }
  document.getElementById('lesson-grade').value = LESSON.grade || '';
  document.getElementById('lesson-skip-probe').checked = LESSON.skipProbe;
  updateLessonNote();
}

function updateLessonNote() {
  // "질문 1개로 줄이기"는 실제 적용 학년이 3~4학년일 때만 보여준다.
  document.getElementById('lesson-skip-probe-row').style.display =
    ['3', '4'].includes(effectiveGrade()) ? 'flex' : 'none';
  const note = document.getElementById('lesson-note');
  const p = LESSON.virtue ? findProfile(LESSON.virtue) : null;
  if (p) {
    const diff = LESSON.grade && LESSON.grade !== p.grade;
    note.textContent = `교과서: ${p.grade}학년 ${p.unit}. 지도서 정의를 기준으로 사례를 만들어요.`
      + (diff ? ` 이야기 수준은 선택한 ${LESSON.grade}학년에 맞춰요.` : '');
  } else if (LESSON.virtue) {
    note.textContent = '지도서 정의가 등록되지 않은 덕목이라, AI가 일반적인 뜻으로 사례를 만들어요.';
  } else {
    note.textContent = '학생이 처음에 덕목을 직접 입력해요. 목록에 있는 덕목이면 지도서 정의를 기준으로 사례를 만들어요.';
  }
}

// 화면의 선택 상자 값을 LESSON에 반영하고 링크·QR을 새로 만든다
function readLessonControls() {
  const sel = document.getElementById('lesson-virtue');
  const custom = document.getElementById('lesson-virtue-custom');
  const gradeSel = document.getElementById('lesson-grade');
  if (sel.value === VIRTUE_STUDENT) { LESSON.virtue = null; custom.style.display = 'none'; }
  else if (sel.value === VIRTUE_CUSTOM) {
    custom.style.display = 'block';
    LESSON.virtue = custom.value.trim() || null;
  } else {
    custom.style.display = 'none';
    LESSON.virtue = sel.value;
  }
  LESSON.grade = gradeSel.value || null; // 빈 값 = 자동(덕목의 교과서 학년, 미등록 덕목은 5~6학년 수준)
  LESSON.skipProbe = document.getElementById('lesson-skip-probe').checked;
  saveLesson();
  updateLessonNote();
  refreshShareLink();
}

function refreshShareLink() {
  const link = buildShareUrl(ROOM_CODE);
  // 화면에는 한글 덕목 이름이 읽히도록 풀어서 보여준다(복사·QR에는 그대로 쓸 수 있는 인코딩된 주소를 쓴다).
  let shown = link;
  try { shown = decodeURI(link); } catch (e) {}
  document.getElementById('room-link-display').textContent = shown;
  document.getElementById('room-qr').src =
    'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(link);
}

function showRoomInfo() {
  document.getElementById('setup-step-key').style.display = 'none';
  document.getElementById('setup-step-room').style.display = 'block';
  renderLessonControls();
  refreshShareLink();
  document.getElementById('setup-overlay').style.display = 'flex';
}

function hideSetupOverlay() {
  document.getElementById('setup-overlay').style.display = 'none';
}

function showShareButton() {
  const shareBtn = document.getElementById('share-btn');
  if (shareBtn) shareBtn.style.display = 'flex';
}

async function createRoom(apiKey) {
  const errEl = document.getElementById('setup-error');
  const btn = document.getElementById('setup-create-btn');
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '만드는 중...';
  try {
    const res = await fetch('/api/create-room', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ apiKey }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '방을 만드는 데 실패했어요.');
    ROOM_CODE = data.roomCode;
    localStorage.setItem('moral_explorer_room', ROOM_CODE);
    showRoomInfo();
  } catch (e) {
    errEl.textContent = '⚠️ ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '방 만들기';
  }
}

function wireSetupScreen() {
  document.getElementById('setup-create-btn').onclick = () => {
    const key = document.getElementById('setup-api-key').value.trim();
    if (!key) {
      document.getElementById('setup-error').textContent = '⚠️ API 키를 입력해 주세요.';
      return;
    }
    createRoom(key);
  };
  document.getElementById('room-copy-btn').onclick = () => {
    const link = buildShareUrl(ROOM_CODE);
    navigator.clipboard.writeText(link).then(() => {
      const b = document.getElementById('room-copy-btn');
      const original = b.textContent;
      b.textContent = '✅ 복사됐어요!';
      setTimeout(() => { b.textContent = original; }, 1500);
    }).catch(() => {});
  };
  document.getElementById('lesson-virtue').onchange = readLessonControls;
  document.getElementById('lesson-grade').onchange = readLessonControls;
  document.getElementById('lesson-virtue-custom').oninput = readLessonControls;
  document.getElementById('lesson-skip-probe').onchange = readLessonControls;
  document.getElementById('room-continue-btn').onclick = () => {
    const sel = document.getElementById('lesson-virtue');
    if (sel.value === VIRTUE_CUSTOM && !LESSON.virtue) {
      document.getElementById('lesson-virtue-custom').focus();
      return;
    }
    hideSetupOverlay();
    showShareButton();
    // 처음 시작하거나 수업 설정이 바뀌었으면 새 설정으로 대화를 다시 시작한다.
    // (설정을 그대로 두고 링크만 확인한 경우에는 하던 대화를 그대로 이어간다)
    if (!appStarted || appliedLessonSig !== lessonSig()) resetAll();
  };
  document.getElementById('room-restart-link').onclick = (e) => {
    e.preventDefault();
    localStorage.removeItem('moral_explorer_room');
    ROOM_CODE = null;
    document.getElementById('setup-api-key').value = '';
    document.getElementById('setup-error').textContent = '';
    document.getElementById('setup-step-room').style.display = 'none';
    document.getElementById('setup-step-key').style.display = 'block';
  };
}

// ---------- boot ----------
(async () => {
  await loadPrompts();
  populateVirtueSelect();
  wireSetupScreen();

  const urlParams = new URLSearchParams(window.location.search);
  const roomFromUrl = urlParams.get('room');

  if (roomFromUrl) {
    // 학생(또는 공유받은 사람): 키 입력 화면 없이 곧바로 시작. 공유 링크 버튼은 보여주지 않는다.
    ROOM_CODE = roomFromUrl.toUpperCase();
    LESSON.virtue = (urlParams.get('v') || '').trim() || null;
    LESSON.grade = normalizeGrade(urlParams.get('g'));
    LESSON.skipProbe = urlParams.get('q') === '1';
    hideSetupOverlay();
    startApp();
    return;
  }

  loadSavedLesson(); // 교사: 전에 골라둔 수업 설정을 그대로 불러온다
  const savedRoom = localStorage.getItem('moral_explorer_room');
  if (savedRoom) {
    // 이전에 방을 만들어둔 선생님이 돌아온 경우: 바로 이어서 쓸 수 있게 하고, 공유 버튼도 보여준다.
    ROOM_CODE = savedRoom;
    hideSetupOverlay();
    showShareButton();
    startApp();
    return;
  }

  // 처음 접속: API 키 입력 화면을 그대로 둔다(#setup-overlay는 기본으로 표시되어 있음).
})();
</script>
